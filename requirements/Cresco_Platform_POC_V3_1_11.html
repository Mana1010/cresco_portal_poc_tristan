  <Cd><div style={{fontSize:13,fontWeight:600,color:B.navy,marginBottom:8}}>Engagement principles</div><div style={{fontSize:12,color:B.muted,lineHeight:1.6}}>Portal and AI workstreams separately priced with independent milestone payments. AI milestones gated by phase acceptance — a phase is not complete until its AI acceptance criteria also pass. Development company nominates a <strong>Technical Lead</strong> with cross-workstream integration authority, present at the weekly cadence with the Programme Owner. LLM cost projection delivered as Week-2 deliverable; reviewed at every phase gate.</div></Cd>
</div>;}

function DashTiers(){return<div><h1 style={{fontSize:22,fontWeight:700,color:B.navy,marginBottom:4}}>Dashboard Tiers</h1><p style={{fontSize:12,color:B.muted,marginBottom:16}}>Phase 5 dashboard structure. Six tiers mapped to Cresco L3–L5 governance.</p>

function App(){const[v,setV]=useState("dash");const[did,setDid]=useState(null);const[sb,setSb]=useState(true);const[aiOn,setAiOn]=useState(true);const{ts,add}=useToast();const cm=v==="client";const[crs,setCrs]=useState([]);
  function addCR(projId,delId,delName,description){setCrs(prev=>{const id=`CR-${String(prev.length+1).padStart(3,"0")}`;const cr={id,projId,delId,delName,description,raisedBy:"client",raisedAt:"2026-05-19",status:"pending_review",classification:null,staffNotes:"",actionedBy:null,actionedAt:null,newDel:null,fee:0};return[...prev,cr];});add("Change Request raised — pending Cresco review","info");}
  function actionCR(id,classification,staffNotes,fee,createDel){setCrs(prev=>{const cr=prev.find(c=>c.id===id);if(!cr)return prev;if(!createDel)return prev.map(c=>c.id===id?{...c,classification,staffNotes,status:"rejected",actionedBy:CURRENT_USER.n,actionedAt:"2026-05-19"}:c);const proj=PROJ.find(p=>p.id===cr.projId);const tier=proj?proj.tier:"Green";const ty=proj?proj.ty:"STR-RESI";const baseN=(proj&&proj.dels?proj.dels.length:0)+prev.filter(x=>x.projId===cr.projId&&x.newDel).length;const newDel={id:`D${baseN+1}`,n:classification==="rework"?`Rework — ${cr.delName} (${cr.id})`:`Variation — ${cr.description.slice(0,40)}${cr.description.length>40?"…":""}`,fee:classification==="rework"?0:(fee||0),st:"01",qa:buildQAChain(tier,ty),submitted:null,crRef:cr.id};return prev.map(c=>c.id===id?{...c,classification,staffNotes,fee:newDel.fee,status:"actioned",actionedBy:CURRENT_USER.n,actionedAt:"2026-05-19",newDel}:c);});add(createDel?`Change Request actioned — new deliverable created`:`Change Request rejected`,createDel?"success":"warning");}
  const[bookingRequests,setBookingRequests]=useState([]);
  function addBooking(projId,clientName,delId,delName,type,window,notes){setBookingRequests(prev=>{const id=`REQ-${String(50+prev.length+1).padStart(4,"0")}`;const req={id,proj:projId,client:clientName,delId,delName,type,window,notes,status:"Awaiting triage",raised:"2026-05-19",raisedBy:"client"};return[...prev,req];});add(`Inspection request submitted for ${type}`,"info");}
  const nav=(vw,id)=>{if(vw==="detail"&&id){setDid(id);setV("detail");}else{setV(vw);setDid(null);}};
  const pg=()=>{switch(v){
    case"dash":return<Dashboard proj={PROJ} nav={nav} toast={add}/>;
    case"proj":return<div><h1 style={{fontSize:22,fontWeight:700,color:B.navy,marginBottom:16}}>Projects ({PROJ.length})</h1><Cd><ST2 cols={[{h:"ID",a:"id"},{h:"Project",a:"n",r:r=>r.n.slice(0,28)},{h:"Client",a:"cl"},{h:"Type",a:"ty"},{h:"Tier",r:r=><TB tier={r.tier}/>,sk:"tier"},{h:"Status",r:r=><SB code={r.st}/>,sk:"st"},{h:"Fee",a:"fe",r:r=>`$${r.fe.toLocaleString()}`},{h:"Owner",a:"po",sk:"po",r:r=>{const s=PO_STAFF.find(x=>x.n===r.po);return s?`${r.po} (L${s.level})`:r.po;}}]} data={PROJ} onRow={r=>nav("detail",r.id)}/></Cd></div>;
    case"detail":return<Detail pid={did} proj={PROJ} crs={crs} back={()=>nav("proj")} toast={add}/>;
    case"prop":return<Proposal toast={add}/>;case"appr":return<Approvals proj={PROJ} crs={crs} actionCR={actionCR} toast={add}/>;
    case"inspA":return<InspA bookingRequests={bookingRequests} toast={add}/>;case"inspB":return<InspB toast={add}/>;case"aiInb":return<AIInbox toast={add} aiOn={aiOn}/>;case"aiAlt":return<AIAlerts toast={add} aiOn={aiOn}/>;case"aiMan":return<AIManifest/>;case"aiGov":return<AIGov/>;case"aiAud":return<AIAudit/>;case"phases":return<Programme/>;case"risks":return<Risks/>;case"dashT":return<DashTiers/>;case"antiG":return<AntiGaming/>;case"kpi":return<KPIAnalytics/>;case"proc":return<ProcFlow/>;
    case"org":return<OrgChart/>;case"roles":return<Roles/>;case"work":return<Workflow/>;
    case"issues":return<Issues toast={add}/>;case"wo":return<WO toast={add}/>;case"time":return<TR/>;
    case"gov":return<Gov/>;case"client":return<Client proj={PROJ} crs={crs} addCR={addCR} bookingRequests={bookingRequests} addBooking={addBooking} toast={add}/>;default:return<Dashboard proj={PROJ} nav={nav} toast={add}/>;
  }};
  return(<div style={{display:"flex",height:"100vh",overflow:"hidden"}}>
    <Toasts ts={ts}/>
    <div style={{width:sb?210:48,background:B.navy,color:"#fff",display:"flex",flexDirection:"column",transition:"width .2s",overflow:"hidden",flexShrink:0}}>
      <div style={{padding:"14px 14px 10px",borderBottom:"1px solid rgba(255,255,255,.1)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        {sb&&<div><div style={{fontSize:15,fontWeight:700,letterSpacing:2}}>CRESCO</div><div style={{fontSize:7,letterSpacing:3,color:B.accent,textTransform:"uppercase"}}>Australia</div></div>}
        <button onClick={()=>setSb(!sb)} style={{background:"none",border:"none",color:"#fff",fontSize:16,padding:2}}>☰</button>
      </div>
      <div style={{flex:1,padding:"6px 0",overflowY:"auto"}}>
        {NAV.map((n,idx)=>{if(n.g){return sb?<div key={"g"+idx} style={{fontSize:8,fontWeight:600,letterSpacing:1.5,color:"rgba(255,255,255,.35)",textTransform:"uppercase",padding:"8px 14px 2px"}}>{n.g}</div>:<div key={"g"+idx} style={{height:1,background:"rgba(255,255,255,.1)",margin:"4px 10px"}}/>;}const a=v===n.id||(v==="detail"&&n.id==="proj");return<button key={n.id} onClick={()=>nav(n.id)} style={{display:"block",width:"100%",padding:sb?"6px 14px":"6px 0",textAlign:sb?"left":"center",background:a?"rgba(14,165,233,.15)":"transparent",border:"none",color:a?B.accent:"rgba(255,255,255,.65)",fontSize:11,fontWeight:a?600:400,borderLeft:a?`3px solid ${B.accent}`:"3px solid transparent"}}>{sb?n.l:"•"}</button>;})}
        <div style={{height:1,background:"rgba(255,255,255,.1)",margin:"6px 10px"}}/>
        {sb&&<div style={{fontSize:8,fontWeight:600,letterSpacing:1.5,color:"rgba(255,255,255,.35)",textTransform:"uppercase",padding:"4px 14px"}}>Client</div>}
        <button onClick={()=>nav("client")} style={{display:"block",width:"100%",padding:sb?"7px 14px":"7px 0",textAlign:sb?"left":"center",background:cm?"rgba(14,165,233,.15)":"transparent",border:"none",color:cm?B.accent:"rgba(255,255,255,.65)",fontSize:12,fontWeight:cm?600:400,borderLeft:cm?`3px solid ${B.accent}`:"3px solid transparent"}}>{sb?"Client View":"★"}</button>
      </div>
      {sb&&<div style={{padding:"8px 14px",borderTop:"1px solid rgba(255,255,255,.1)",fontSize:8,color:"rgba(255,255,255,.25)"}}>OOM · Process Manual · POC v3.1.11 · Brief v1.3</div>}
    </div>
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{height:48,background:"#fff",borderBottom:`1px solid ${B.bdr}`,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 20px",flexShrink:0}}>
        <div style={{display:"flex",gap:12,alignItems:"center"}}><span style={{fontSize:11,fontWeight:600,padding:"3px 8px",borderRadius:4,background:cm?`${B.accent}15`:`${B.navy}10`,color:cm?B.accent:B.navy}}>{cm?"CLIENT":"STAFF"}</span><span style={{fontSize:10,color:B.muted}}>{TM} KPIs · {PROJ.length} Projects · {SCS.length} Roles · {AI_ALERTS.filter(a=>a.state==="fire").length} live AI alerts · {INSP_BOOKINGS.length} inspections booked</span></div>
        <div style={{display:"flex",alignItems:"center",gap:10}}><button onClick={()=>{setAiOn(!aiOn);add(aiOn?"AI layer OFF — degraded mode":"AI layer ON","info");}} style={{padding:"4px 10px",borderRadius:12,border:`1px solid ${aiOn?B.success:B.danger}40`,background:aiOn?`${B.success}15`:`${B.danger}15`,color:aiOn?B.success:B.danger,fontSize:10,fontWeight:700,cursor:"pointer"}}>AI {aiOn?"ON":"OFF"}</button><div style={{width:26,height:26,borderRadius:"50%",background:B.navy,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:10,fontWeight:700}}>{cm?"CL":CURRENT_USER.n.split(" ").map(w=>w[0]).join("").slice(0,2)}</div><div style={{fontSize:11,fontWeight:600,color:B.navy}}>{cm?"Client":CURRENT_USER.n}</div><span style={{fontSize:10,padding:"1px 6px",borderRadius:3,background:`${B.accent}15`,color:B.accent,fontWeight:600}}>{cm?"":"L"+CURRENT_USER.level}</span></div>
      </div>
      <div style={{flex:1,overflow:"auto",padding:20,background:B.bg}}>{pg()}</div>
    </div>
  </div>);
}
ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
