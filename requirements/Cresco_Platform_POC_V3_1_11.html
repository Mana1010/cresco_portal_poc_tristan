function suggestReviewer(roleLabel,discipline){
  if(!roleLabel)return"—";
  if(roleLabel.startsWith("L1"))return(L1_PEERS[discipline]||L1_PEERS["STR-RESI"])[0];
  if(roleLabel.startsWith("L2"))return DISCIPLINE_LEAD[discipline]||"—";

  if(roleLabel.startsWith("L4"))return"Vince Chaffey";
  if(roleLabel.startsWith("L5"))return"Shane Lutze";

}
function reviewerPool(roleLabel,discipline){
  if(!roleLabel)return[];
  if(roleLabel.startsWith("L1"))return L1_PEERS[discipline]||L1_PEERS["STR-RESI"];
  if(roleLabel.startsWith("L2"))return PO_STAFF.filter(s=>s.level>=2&&s.level<=3).map(s=>s.n);
  if(roleLabel.startsWith("L3"))return PO_STAFF.filter(s=>s.level===3||s.level===4).map(s=>s.n);
  if(roleLabel.startsWith("L4"))return PO_STAFF.filter(s=>s.level>=4).map(s=>s.n);
  if(roleLabel.startsWith("L5"))return PO_STAFF.filter(s=>s.level===5).map(s=>s.n);
  return PO_STAFF.map(s=>s.n);

function buildQAChain(tier,discipline){

  });
}

function seedDeliverablesFromTemplate(projType,totalFee,tier,discipline){
  const t=(DEL_TEMPLATES[projType]||DEL_TEMPLATES["STR-RESI"]).slice();
  const baseSum=t.reduce((s,i)=>s+i.base,0);
  const scale=baseSum>0?(totalFee/baseSum):1;
  return t.map((it,i)=>({
    id:`D${i+1}`,n:it.n,fee:Math.round(it.base*scale),st:"01",
    qa:buildQAChain(tier,discipline),submitted:null
  }));
}

function seedExistingDeliverables(p){
  const t=(DEL_TEMPLATES[p.ty]||DEL_TEMPLATES["STR-RESI"]).slice();
  const baseSum=t.reduce((s,i)=>s+i.base,0);
  const scale=baseSum>0?(p.fe/baseSum):1;
  const anchor=parseInt(p.st)||2;
  return t.map((it,i)=>{
    let n=Math.max(1,Math.min(25,anchor+(i-Math.floor(t.length/2))));
    if(p.st==="06"&&i===0)n=6;
    if(p.st==="25"&&i===0)n=25;
    const code=String(n).padStart(2,"0");
    const validCode=ST[code]?code:"02";
    const qa=buildQAChain(p.tier,p.ty);
    const num=parseInt(validCode);
    if(num>=4&&qa[0]&&qa[0].required)qa[0].status="approved";
    if(num>=5&&qa[1]&&qa[1].required)qa[1].status="approved";
    if(num>=6&&qa[2]&&qa[2].required)qa[2].status="approved";
    if(num>=8&&qa[3]&&qa[3].required)qa[3].status="approved";
    if(num===6&&qa[0]&&qa[0].required){qa[0].status="rework";qa[0].obs="Connection detail unclear — see review comments.";}
    // Pick the last REQUIRED tier for client-escape rework
    const lastReqIdx=[...qa].reverse().findIndex(q=>q.required);
    const lrIdx=lastReqIdx===-1?-1:(qa.length-1-lastReqIdx);
    if(num===25&&lrIdx>=0){qa[lrIdx].status="rework";qa[lrIdx].obs="Client-identified — Non-conformance raised.";}
    if(num===3&&qa[0]&&qa[0].required)qa[0].status="in_review";
    if(num===4&&qa[1]&&qa[1].required)qa[1].status="in_review";
    if(num===5&&qa[2]&&qa[2].required)qa[2].status="in_review";
    // Stamp a "since" date on every in_review / rework tier so the Approvals page can show ageing
    qa.forEach((q,k)=>{if(q.status==="in_review"||q.status==="rework"){const seedNum=(parseInt((p.id.split("-")[2]||"0"))+k*3+i)%12;q.since=inspAddDays("2026-05-19",-seedNum);}});
    return{id:`D${i+1}`,n:it.n,fee:Math.round(it.base*scale),st:validCode,qa,
      submitted:num>=3?{url:`sharepoint://cresco/projects/${p.id}/QA/D${i+1}_${it.n.replace(/[^A-Za-z0-9]/g,"_")}.pdf`,when:"2026-04-12 09:00",by:p.po}:null};
  });
}

function qaStatusChip(s){
  const m={pending:{c:B.muted,l:"Pending"},in_review:{c:B.warn,l:"In Review"},approved:{c:B.success,l:"Approved"},rework:{c:B.danger,l:"Rework"},n_a:{c:B.muted,l:"N/A"}}[s]||{c:B.muted,l:s};

function useToast(){const[ts,set]=useState([]);const add=useCallback((m,t="info")=>{const i=Date.now();set(p=>[...p,{i,m,t}]);setTimeout(()=>set(p=>p.filter(x=>x.i!==i)),3500);},[]);return{ts,add};}

function SC({label,value,sub,color=B.accent,al}){return<Cd style={{position:"relative"}}><div style={{fontSize:12,color:B.muted,marginBottom:2}}>{label}</div><div style={{fontSize:22,fontWeight:700,color:B.navy}}>{value}</div>{sub&&<div style={{fontSize:11,color:B.muted,marginTop:2}}>{sub}</div>}{al&&<div style={{position:"absolute",top:10,right:10}}><AB l={al}/></div>}</Cd>;}

function ST2({cols,data,onRow}){
  const[fl,setFl]=useState("");
  const[sCol,setSCol]=useState(null);
  const[sDir,setSDir]=useState("asc");
  const fd=useMemo(()=>{
    if(!fl)return data;
    const f=fl.toLowerCase();
    return data.filter(r=>cols.some(c=>{
      if(c.a)return String(r[c.a]).toLowerCase().includes(f);
      if(c.sk)return String(r[c.sk]).toLowerCase().includes(f);
      return false;
    }));
  },[data,fl,cols]);
  const sorted=useMemo(()=>{
    if(sCol===null)return fd;
    const col=cols[sCol];
    const key=col.sk||col.a;
    if(!key)return fd;
    return[...fd].sort((a,b)=>{
      let av=a[key],bv=b[key];
      if(av==null)return 1;if(bv==null)return -1;
      if(typeof av==="number"&&typeof bv==="number")return sDir==="asc"?av-bv:bv-av;
      return sDir==="asc"?String(av).localeCompare(String(bv)):String(bv).localeCompare(String(av));
    });
  },[fd,sCol,sDir,cols]);
  const doSort=(i)=>{if(sCol===i)setSDir(d=>d==="asc"?"desc":"asc");else{setSCol(i);setSDir("asc");}};
  return(<div><div style={{display:"flex",gap:8,marginBottom:12}}><input value={fl} onChange={e=>setFl(e.target.value)} placeholder="Filter..." style={{flex:1,maxWidth:320,padding:"8px 12px",borderRadius:6,border:`1px solid ${B.bdr}`,fontSize:13,outline:"none"}}/><span style={{fontSize:12,color:B.muted,alignSelf:"center"}}>{sorted.length} records</span></div><div style={{overflowX:"auto",borderRadius:8,border:`1px solid ${B.bdr}`}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}><thead><tr style={{background:"#F8FAFC"}}>{cols.map((c,i)=><th key={i} onClick={()=>(c.a||c.sk)&&doSort(i)} style={{padding:"10px 12px",textAlign:"left",fontWeight:600,color:B.navy,borderBottom:`2px solid ${B.bdr}`,whiteSpace:"nowrap",fontSize:12,cursor:(c.a||c.sk)?"pointer":"default",userSelect:"none"}}>{c.h}{sCol===i?(sDir==="asc"?" ▲":" ▼"):""}</th>)}</tr></thead><tbody>{sorted.length===0?<tr><td colSpan={cols.length} style={{padding:24,textAlign:"center",color:B.muted}}>No data</td></tr>:sorted.map((r,i)=><tr key={r.id||i} onClick={()=>onRow&&onRow(r)} className="hr" style={{cursor:onRow?"pointer":"default",borderBottom:`1px solid ${B.bdr}`}}>{cols.map((c,j)=><td key={j} style={{padding:"10px 12px",whiteSpace:"nowrap"}}>{c.r?c.r(r):r[c.a]}</td>)}</tr>)}</tbody></table></div></div>);
}

    </Cd>
  </div>);
}

    setRuns(p=>({...p,[k]:{ts,result}}));
    toast(`Cresco Labs · ${verb} complete — ${result.slice(0,60)}${result.length>60?"…":""}`,"success");
  }
  const groups=[
    {g:"Project setup",items:[
      {k:"PIS",title:"Setup Project Information Spreadsheet",verb:"Setup",desc:"Creates the standard PIS workbook from project metadata and writes it to the project's SharePoint folder.",mock:`Created ${project.id}_PIS.xlsx in SharePoint /Projects/${project.id}/`}

    {g:"Engineering compute",items:[
      {k:"Checkwind",title:"Generate Checkwind",verb:"Generate",desc:"Wind classification per AS 4055 / AS/NZS 1170.2 using project location and terrain.",mock:"Wind: N2 · Region A · Terrain Cat 2 · Shielding partial · Topography T1"},
      {k:"ClimateZone",title:"Generate Climate Zone",verb:"Generate",desc:"Climate zone classification per NCC Volume Two for thermal performance compliance.",mock:"Climate Zone 4 — Hot dry summer / cool winter"}

      {k:"ARR",title:"Fetch ARR data",verb:"Fetch",desc:"Australian Rainfall & Runoff (ARR 2019) IFD curves for the project site, drawn from BOM.",mock:"1% AEP IFD: 138 mm/hr (1hr) · 192 mm/hr (10min) · Source ARR2019"},
      {k:"Council",title:"Fetch Council Data",verb:"Fetch",desc:"LEP zoning, overlays, easements, heritage and bushfire prone-land status via the council planning portal.",mock:"Wagga Wagga LGA · LEP 2010 · Zone R1 General Residential · No heritage overlay · BPL Cat 1"}
    ]},
    {g:"Handoff",items:[
      {k:"ArchExtract",title:"Send to Arch Extract",verb:"Send",desc:"Pushes the architectural drawing pack to ArchExtract for automated extraction of dimensions, finishes and schedules.",mock:"Queued — job ARX-2026-0118 (est. 3 min)"}
    ]}
  ];
  return <div>
    <Cd style={{marginBottom:14,background:"#F8FAFC",borderLeft:`4px solid ${B.accent}`}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12,flexWrap:"wrap"}}>
        <div style={{flex:1,minWidth:240}}>
          <div style={{fontSize:13,fontWeight:700,color:B.navy,marginBottom:4}}>Cresco Labs — engineering automation platform</div>
          <div style={{fontSize:11,color:B.muted,lineHeight:1.5}}>Each button calls a Labs action against this project. Results write back to the project record and are linked from this tab.</div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <span style={{fontSize:10,padding:"3px 8px",borderRadius:10,background:`${B.success}15`,color:B.success,fontWeight:600}}>Live</span>
          <span style={{fontSize:11,color:B.muted}}>{Object.keys(runs).length}/6 actions run</span>
        </div>
      </div>
    </Cd>
    {groups.map(group=><div key={group.g} style={{marginBottom:16}}>
      <div style={{fontSize:11,fontWeight:700,letterSpacing:1,textTransform:"uppercase",color:B.muted,marginBottom:8,paddingLeft:2}}>{group.g}</div>
      <div style={{display:"grid",gridTemplateColumns:group.items.length===1?"1fr":"1fr 1fr",gap:12}}>
        {group.items.map(item=>{const run=runs[item.k];return<Cd key={item.k}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:14,fontWeight:600,color:B.navy}}>{item.title}</div>
              <div style={{fontSize:11,color:B.muted,marginTop:4,lineHeight:1.45}}>{item.desc}</div>
            </div>
            <button onClick={()=>runAction(item.k,item.verb,item.mock)} style={{padding:"8px 14px",borderRadius:6,border:"none",background:run?B.success:B.accent,color:"#fff",fontSize:12,fontWeight:600,whiteSpace:"nowrap",cursor:"pointer"}}>{run?"Re-run":item.verb}</button>
          </div>
          {run&&<div style={{marginTop:10,padding:10,background:"#ECFDF5",border:"1px solid #A7F3D0",borderRadius:6}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:4}}>
              <span style={{fontSize:10,color:B.success,fontWeight:600}}>✓ Last run {run.ts}</span>
              <span style={{fontSize:10,color:B.muted}}>via Labs API</span>
            </div>
            <div style={{fontSize:11,color:B.navy,fontFamily:"'Menlo','Monaco',monospace",wordBreak:"break-word"}}>{run.result}</div>
          </div>}
        </Cd>;})}
      </div>
    </div>)}
    <Cd style={{marginTop:6}}>
      <div style={{fontSize:12,color:B.muted,lineHeight:1.5}}><strong style={{color:B.navy}}>Note (POC):</strong> Labs actions are stubbed in this prototype with representative output. In production each button calls the corresponding Cresco Labs endpoint, the project record stamps the result and timestamp, and source artefacts (XLSX, PDF, JSON) land in the project's SharePoint folder. Re-running an action overwrites the previous result and writes a new entry to the project audit log.</div>
    </Cd>
  </div>;
}

function Detail({pid,proj,crs,back,toast}){
  const p=proj.find(x=>x.id===pid);const[tab,setTab]=useState("Overview");
  const[dels,setDels]=useState(p?p.dels||[]:[]);
  const[selDel,setSelDel]=useState(null);
  const[showSubmit,setShowSubmit]=useState(false);
  const[submitDelId,setSubmitDelId]=useState(null);
  const[pdfUrl,setPdfUrl]=useState("");
  useEffect(()=>{if(p){const crDels=(crs||[]).filter(c=>c.projId===p.id&&c.newDel).map(c=>c.newDel);setDels([...(p.dels||[]),...crDels]);setSelDel(null);}},[pid,(crs||[]).length]);
  if(!p)return<div style={{padding:40,textAlign:"center",color:B.muted}}>Not found</div>;
  const docs=DOCS[p.ty]||DOCS["STR-RESI"];const isRw=p.st==="06"||p.st==="25";

  function openSubmit(dId){setSubmitDelId(dId);setPdfUrl("");setShowSubmit(true);}
  function doSubmit(){
    if(!pdfUrl.trim()){toast("PDF link required","warning");return;}
    const d=dels.find(x=>x.id===submitDelId);if(!d){setShowSubmit(false);return;}
    const next=dels.map(x=>{
      if(x.id!==submitDelId)return x;
      const newQa=x.qa.map((q,i)=>i===0?{...q,status:"in_review",date:new Date().toISOString().slice(0,10),since:new Date().toISOString().slice(0,10)}:q);
      const newSt=x.st==="01"||x.st==="02"?"03":x.st;
      return{...x,st:newSt,submitted:{url:pdfUrl.trim(),when:new Date().toISOString().slice(0,16).replace("T"," "),by:p.po},qa:newQa};
    });
    setDels(next);
    const reviewer=d.qa[0]?d.qa[0].assigned:"—";
    toast(`Submitted "${d.n}" for L1 review — ${reviewer} notified`,"success");
    setShowSubmit(false);
  }
  function setReviewer(dId,tierIdx,name){
    setDels(prev=>prev.map(d=>{
      if(d.id!==dId)return d;
      return{...d,qa:d.qa.map((q,i)=>i===tierIdx?{...q,assigned:name}:q)};
    }));
  }
  function totalFromDels(){return dels.reduce((s,d)=>s+(d.fee||0),0);}

  return(<div>
    <button onClick={back} style={{background:"none",border:"none",color:B.accent,fontSize:13,fontWeight:500,marginBottom:16,padding:0}}>← Back</button>
    <Cd style={{marginBottom:16}}>
      <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
        <div><div style={{display:"flex",alignItems:"center",gap:10,marginBottom:4}}><span style={{fontSize:12,fontFamily:"monospace",color:B.muted}}>{p.id}</span><TB tier={p.tier}/>{p.bx&&<span style={{fontSize:10,fontWeight:600,padding:"2px 8px",borderRadius:4,background:"#FEF3C7",color:"#92400E"}}>BIAX {p.br}</span>}</div>
          <h2 style={{fontSize:18,fontWeight:700,color:B.navy,margin:"4px 0"}}>{p.n}</h2>
          <div style={{fontSize:13,color:B.muted}}>{p.cl} · {(PTYPES.find(t=>t.c===p.ty)||{}).l}</div></div>
        <div style={{textAlign:"right"}}><SB code={p.st}/><div style={{fontSize:22,fontWeight:700,color:B.navy,marginTop:8}}>${p.fe.toLocaleString()}</div><div style={{fontSize:10,color:B.muted}}>{dels.length} deliverable{dels.length===1?"":"s"} · sum ${totalFromDels().toLocaleString()}</div></div>
      </div>
      {isRw&&<div style={{marginTop:12,padding:12,borderRadius:8,background:p.st==="25"?"#FEF2F2":"#FFFBEB",border:`1px solid ${p.st==="25"?"#FCA5A5":"#FCD34D"}`}}>
        <div style={{fontSize:13,fontWeight:600,color:p.st==="25"?B.danger:"#92400E"}}>{p.st==="25"?"QA ESCAPE — Client-Identified Rework (Status 25)":"Internal Rework (Status 06)"}</div>
        <div style={{fontSize:12,color:p.st==="25"?B.danger:"#92400E",marginTop:4}}>$0 Revenue Contribution. Routes to reviewer chain.{p.st==="25"?" DH + EM notified. Auto-generates Non-conformance record.":""}</div>
      </div>}
    </Cd>
    <Tabs tabs={["Overview","Documents","Labs","QA Chain","Transmittals","Variations"]} active={tab} onChange={setTab}/>
    {tab==="Overview"&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
      <Cd><h3 style={{fontSize:14,fontWeight:600,color:B.navy,margin:"0 0 12px"}}>Details</h3>{[["Project Owner",`${p.po} (L${PO_STAFF.find(s=>s.n===p.po)?.level||"?"})`],["Lead",p.le],["Type",(PTYPES.find(t=>t.c===p.ty)||{}).l],["Complexity",`T${p.te} × V${p.vo} = ${p.score}`],["Tier",p.tier],["Fee",`$${p.fe.toLocaleString()}`],["Doc Path",`Path ${p.dp}`],["Payment",p.pd?"✓ Paid":"Outstanding"]].map(([k,v])=><div key={k} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:`1px solid ${B.bdr}`,fontSize:13}}><span style={{color:B.muted}}>{k}</span><span style={{fontWeight:500}}>{v}</span></div>)}</Cd>
      <Cd><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><h3 style={{fontSize:14,fontWeight:600,color:B.navy,margin:0}}>Deliverables ({dels.length})</h3><span style={{fontSize:10,color:B.muted}}>Status linked to Total Synergy</span></div>
        {dels.length===0?<div style={{padding:16,textAlign:"center",fontSize:12,color:B.muted}}>No deliverables seeded for this project</div>:
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}><thead><tr style={{background:"#F8FAFC"}}>{["#","Deliverable","Fee","Status","QA"].map(h=><th key={h} style={{padding:"8px 8px",textAlign:"left",borderBottom:`1px solid ${B.bdr}`,fontSize:11,fontWeight:600,color:B.muted}}>{h}</th>)}</tr></thead>

        </tr>;})}</tbody></table>}
        <div style={{marginTop:10,padding:10,background:"#F8FAFC",borderRadius:6,fontSize:11,color:B.muted}}>Each deliverable carries its own Synergy status (01–25) and an independent QA chain by tier <strong>{p.tier}</strong>. Click a row to open the QA Chain tab on that deliverable.</div>
      </Cd>
    </div>}
    {tab==="Documents"&&<Cd>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:12}}><h3 style={{fontSize:14,fontWeight:600,color:B.navy,margin:0}}>Document Register</h3>{parseInt(p.st)>=2&&<span style={{fontSize:11,fontWeight:600,padding:"3px 10px",borderRadius:4,background:"#FEF2F2",color:B.danger}}>LOCKED</span>}</div>
      <div style={{fontSize:12,color:B.muted,marginBottom:8}}>Path {p.dp} — {p.dp===2?"Variation ack required. ":""}Persistent attribute. Locks at Status 02.</div>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}><thead><tr style={{background:"#F8FAFC"}}><th style={{padding:"8px 12px",textAlign:"left",borderBottom:`2px solid ${B.bdr}`,fontSize:12}}>Document</th><th style={{padding:"8px 12px",textAlign:"left",borderBottom:`2px solid ${B.bdr}`,fontSize:12}}>Status</th><th style={{padding:"8px 12px",textAlign:"left",borderBottom:`2px solid ${B.bdr}`,fontSize:12}}>Date</th></tr></thead>
      <tbody>{docs.map((d,i)=>{const sub=i<docs.length-(p.dp===1?0:2);return<tr key={i} style={{borderBottom:`1px solid ${B.bdr}`}}><td style={{padding:"8px 12px"}}>{d}</td><td style={{padding:"8px 12px"}}>{sub?<span style={{color:B.success}}>✓</span>:<span style={{color:B.warn}}>Pending</span>}</td><td style={{padding:"8px 12px",color:B.muted}}>{sub?`2026-01-${String(10+i).padStart(2,"0")}`:"—"}</td></tr>;})}</tbody></table>
      {p.dp===2&&<div style={{marginTop:12,padding:12,borderRadius:6,background:"#FFFBEB",fontSize:12,color:"#92400E"}}>"By allowing Cresco to commence without these documents you acknowledge that your project will require a variation to your engagement."</div>}
    </Cd>}
    {tab==="Labs"&&<ProjectLabs project={p} toast={toast}/>}
    {tab==="QA Chain"&&<div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
        <div style={{fontSize:13,color:B.muted}}>QA chain per deliverable — tier <strong style={{color:T[p.tier].t}}>{p.tier}</strong>, discipline <strong>{p.ty}</strong>. Auto-suggested reviewers can be overridden per tier.</div>
      </div>
      {dels.length===0?<Cd><div style={{padding:16,textAlign:"center",fontSize:12,color:B.muted}}>No deliverables to review</div></Cd>:

          <div><div style={{display:"flex",alignItems:"center",gap:10}}><span style={{fontFamily:"monospace",fontSize:11,color:B.muted}}>{d.id}</span><div style={{fontSize:14,fontWeight:600,color:B.navy}}>{d.n}</div><SB code={d.st}/></div><div style={{fontSize:11,color:B.muted,marginTop:2}}>${d.fee.toLocaleString()} · {d.qa.filter(q=>q.status==="approved").length}/{d.qa.length} approved {d.submitted?`· PDF submitted ${d.submitted.when}`:""}</div></div>
          <span style={{fontSize:11,color:B.accent,fontWeight:600}}>{open?"▾ Collapse":"▸ Expand"}</span>

        <div style={{padding:12,background:"#FFFBEB",borderRadius:6}}><strong style={{fontSize:12,color:"#92400E"}}>Status 06 — Internal</strong><div style={{fontSize:11,color:"#92400E",marginTop:4}}>Caught by QA. Feeds Deliverable Approval First-Pass Rate.</div></div>
        <div style={{padding:12,background:"#FEF2F2",borderRadius:6}}><strong style={{fontSize:12,color:B.danger}}>Status 25 — Client-Identified</strong><div style={{fontSize:11,color:B.danger,marginTop:4}}>QA escape. Feeds QA Escape Rate. Auto-generates Non-conformance record.</div></div>

    {tab==="Variations"&&<Cd>{parseInt(p.st)>=18&&parseInt(p.st)<=23?<div><div style={{padding:12,borderRadius:6,background:"#FFFBEB",marginBottom:12}}><div style={{fontSize:13,fontWeight:500,color:"#92400E"}}>Active: {ST[p.st]}</div></div>
      <div style={{fontSize:13,fontWeight:600,color:B.navy,marginBottom:8}}>Dispute Classification</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>{[{l:"Accepted",c:B.success},{l:"Disputed & Upheld",c:B.warn},{l:"Disputed & Conceded",c:B.danger}].map(x=><div key={x.l} style={{padding:10,borderRadius:6,background:`${x.c}08`,border:`1px solid ${x.c}30`,textAlign:"center"}}><div style={{fontSize:12,fontWeight:600,color:x.c}}>{x.l}</div></div>)}</div>
    </div>:<div style={{padding:24,textAlign:"center",color:B.muted}}>No active variations</div>}</Cd>}
    {showSubmit&&<div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(11,18,32,.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9000}} onClick={()=>setShowSubmit(false)}>
      <div onClick={e=>e.stopPropagation()} style={{width:560,background:"#fff",borderRadius:10,padding:20,boxShadow:"0 20px 60px rgba(0,0,0,.25)"}}>
        <h3 style={{fontSize:16,fontWeight:700,color:B.navy,marginBottom:6}}>Submit for Internal Review</h3>
        <div style={{fontSize:12,color:B.muted,marginBottom:14}}>{(()=>{const d=dels.find(x=>x.id===submitDelId);return d?`${d.id} · ${d.n} — paste the SharePoint or PDF link for L1 peer review`:"";})()}</div>
        <label style={{fontSize:11,color:B.muted,display:"block",marginBottom:4}}>PDF location (SharePoint or shared link)</label>
        <input value={pdfUrl} onChange={e=>setPdfUrl(e.target.value)} placeholder="https://cresco.sharepoint.com/sites/projects/.../deliverable.pdf" style={{width:"100%",padding:"8px 10px",borderRadius:6,border:`1px solid ${B.bdr}`,fontSize:12,marginBottom:10,boxSizing:"border-box"}}/>
        {(()=>{const d=dels.find(x=>x.id===submitDelId);if(!d||!d.qa[0])return null;return<div style={{padding:10,background:"#F8FAFC",borderRadius:6,fontSize:11,color:B.muted,marginBottom:14}}><strong style={{color:B.navy}}>L1 reviewer:</strong> {d.qa[0].assigned}{d.qa[0].assigned!==d.qa[0].suggested?<span style={{color:B.warn,marginLeft:6}}>(override of suggested {d.qa[0].suggested})</span>:""} · This advances the deliverable from Status {d.st} → 03 L1 Check and notifies the reviewer.</div>;})()}
        <div style={{display:"flex",justifyContent:"flex-end",gap:8}}>
          <button onClick={()=>setShowSubmit(false)} style={{padding:"8px 16px",borderRadius:6,border:`1px solid ${B.bdr}`,background:"#fff",fontSize:12}}>Cancel</button>
          <button onClick={doSubmit} style={{padding:"8px 16px",borderRadius:6,border:"none",background:B.accent,color:"#fff",fontSize:12,fontWeight:600}}>Submit & notify L1</button>
        </div>
      </div>
    </div>}
  </div>);
}

function Proposal({toast}){
  const[step,setStep]=useState(1);
  const[f,setF]=useState({n:"",cl:"",ty:"STR-RESI",po:"",te:1,vo:1});
  const isResi=f.ty==="STR-RESI";
  // Resi items use new 50-item model. Initial state: items with def==="Required" start incl=true, qty=1
  const[resiItems,setResiItems]=useState(()=>RESI_ITEMS.map(it=>({...it,qty:it.def==="Required"?1:0,factor:1.0,incl:it.def==="Required"})));
  const[resiCustom,setResiCustom]=useState([]);const[rcName,setRcName]=useState("");const[rcFee,setRcFee]=useState("");const[rcHrs,setRcHrs]=useState("");
  // Townhouse mode
  const[townhouse,setTownhouse]=useState(false);
  const[uniqueUnits,setUniqueUnits]=useState(1);
  const[repeatUnits,setRepeatUnits]=useState(0);
  const[repeatFactor,setRepeatFactor]=useState(0.7);
  // Standard mode
  const[dels,setDels]=useState([{name:"",res:[{ri:6,hrs:0}]}]);
  const[docList,setDocList]=useState([]);const[cDoc,setCDoc]=useState("");
  const[propDels,setPropDels]=useState([]);
  useEffect(()=>{setDocList((DOCS[f.ty]||DOCS["STR-RESI"]).map(d=>({name:d,req:true,cust:false})));},[f.ty]);

  // Townhouse multiplier
  const thMul=townhouse?(uniqueUnits+repeatUnits*repeatFactor):1;
  // Per-item adjusted helpers
  const adjFee=it=>it.fee*it.factor*(it.qty||1)*(isResi?thMul:1);
  const adjHrs=it=>it.hrs*it.factor*(it.qty||1)*(isResi?thMul:1);
  const adjBud=it=>it.hrs*it.factor*(it.qty||1)*RESI_COST_RATE*(isResi?thMul:1);

  // Three-section resi totals
  const includedItems=[...resiItems.filter(i=>i.incl),...resiCustom.filter(i=>i.incl)];
  const reqItems=includedItems.filter(i=>i.def==="Required");
  const optItems=includedItems.filter(i=>i.def==="Optional"||(i.def==="")||(!i.def&&!i.custom));
  const varItems=includedItems.filter(i=>i.def==="Variation");
  const customIn=resiCustom.filter(i=>i.incl);
  // Treat custom items as Optional unless flagged otherwise
  const requiredFees=reqItems.reduce((s,i)=>s+adjFee(i),0);
  const optionalFees=[...optItems,...customIn.filter(i=>!i.def||i.def==="Optional")].reduce((s,i)=>s+adjFee(i),0);
  const variationFees=varItems.reduce((s,i)=>s+adjFee(i),0);
  const resiProposal=requiredFees+optionalFees;  // main proposal — variation excluded
  const resiBudget=[...reqItems,...optItems,...customIn].reduce((s,i)=>s+adjBud(i),0);
  const resiMargin=resiProposal>0?((resiProposal-resiBudget)/resiProposal*100).toFixed(1):0;
  const resiHrs=[...reqItems,...optItems,...customIn].reduce((s,i)=>s+adjHrs(i),0);

  // Calculated complexity (from spreadsheet Complexity Criteria)
  const totalRisk=[...reqItems,...optItems].reduce((s,i)=>s+(i.risk||0),0);
  const complxRating=totalRisk>15?4:totalRisk>10?3:totalRisk>=5?2:1;
  const extentRating=resiHrs>20?4:resiHrs>=10?3:resiHrs>=5?2:1;

  // Standard mode fee calc
  const stdFee=dels.reduce((s,d)=>s+d.res.reduce((rs,r)=>rs+r.hrs*RESOURCES[r.ri].r,0),0);
  const stdHrs=dels.reduce((s,d)=>s+d.res.reduce((rs,r)=>rs+r.hrs,0),0);

  const tFee=isResi?resiProposal:stdFee;
  // Tier sourcing — resi uses calculated complx/extent; non-resi uses user-picked T/V
  const tier=isResi?gTier(complxRating,extentRating):gTier(f.te,f.vo);
  const ft=tFee?gFee(tFee):"Green";
  const ei=Math.max(["Green","Blue","Amber","Red"].indexOf(tier),["Green","Blue","Amber","Red"].indexOf(ft));
  const fin=["Green","Blue","Amber","Red"][ei];
  const qa=QAC[fin];
  const iS={width:"100%",padding:"8px 12px",borderRadius:6,border:`1px solid ${B.bdr}`,fontSize:13,outline:"none",boxSizing:"border-box"};

  function buildPropDels(){
    let raw;
    if(isResi){
      const inc=[...resiItems.filter(i=>i.incl),...resiCustom.filter(i=>i.incl)];
      // Exclude variation items from the main deliverable set (they're separately quoted)
      const mainItems=inc.filter(i=>i.def!=="Variation");
      raw=mainItems.flatMap(it=>{
        const baseFee=it.fee*it.factor*(it.qty||1);
        if(townhouse){
          const uFee=baseFee*uniqueUnits;
          const rFee=baseFee*repeatUnits*repeatFactor;
          const list=[];
          if(uniqueUnits>0)list.push({n:`${it.n} — Unique unit type${uniqueUnits>1?" ×"+uniqueUnits:""}`,fee:uFee,thLabel:"Unique"});
          if(repeatUnits>0)list.push({n:`${it.n} — Repeated units (spot check) ×${repeatUnits}`,fee:rFee,thLabel:"Repeated"});
          return list;
        }
        return[{n:`${it.n}${(it.qty||1)>1?" × "+(it.qty||1):""}`,fee:baseFee}];
      });
    }else{
      raw=dels.map((d,i)=>({n:d.name||`Deliverable ${i+1}`,fee:d.res.reduce((s,r)=>s+r.hrs*RESOURCES[r.ri].r,0)}));
    }
    return raw.map((d,i)=>({id:`D${i+1}`,n:d.n,fee:Math.round(d.fee),qa:buildQAChain(fin,f.ty),thLabel:d.thLabel}));
  }
  function enterQAStep(){setPropDels(buildPropDels());setStep(4);}
  function setPropReviewer(dIdx,tIdx,name){setPropDels(prev=>prev.map((d,i)=>i!==dIdx?d:{...d,qa:d.qa.map((q,j)=>j!==tIdx?q:{...q,assigned:name})}));}

  const toggleResi=idx=>{const r=[...resiItems];r[idx].incl=!r[idx].incl;if(r[idx].incl&&r[idx].qty===0)r[idx].qty=1;setResiItems(r);};
  const setResiFactor=(idx,v)=>{const r=[...resiItems];r[idx].factor=parseFloat(v)||1;setResiItems(r);};
  const setResiQty=(idx,v)=>{const r=[...resiItems];r[idx].qty=parseInt(v)||0;setResiItems(r);};
  const addResiCustom=()=>{if(rcName.trim()&&rcFee){setResiCustom([...resiCustom,{id:`C${resiCustom.length+1}`,n:rcName.trim(),fee:parseFloat(rcFee)||0,hrs:parseFloat(rcHrs)||1,qty:1,factor:1.0,incl:true,custom:true,def:"Optional",risk:0,complx:1}]);setRcName("");setRcFee("");setRcHrs("");}};
  const addDel=()=>setDels([...dels,{name:"",res:[{ri:6,hrs:0}]}]);
  const addRes=di=>{const d=[...dels];d[di].res.push({ri:6,hrs:0});setDels(d);};
  const uDel=(di,k,v)=>{const d=[...dels];d[di][k]=v;setDels(d);};
  const uRes=(di,ri,k,v)=>{const d=[...dels];d[di].res[ri][k]=v;setDels(d);};
  const rmDel=di=>{if(dels.length>1)setDels(dels.filter((_,i)=>i!==di));};
  const rmRes=(di,ri)=>{const d=[...dels];if(d[di].res.length>1){d[di].res=d[di].res.filter((_,i)=>i!==ri);setDels(d);}};

  const stepLabels=["Project","Scope & Fee","Documents","Deliverables & QA","Review"];

  // Helper to render one item row in resi step 2 (shared by all three sections)
  function ItemRow({it,idx,custom}){
    const adj=adjFee(it);const bud=adjBud(it);const mg=adj>0?((adj-bud)/adj*100).toFixed(0):"";
    const bg=it.def==="Required"?"#F0FDF4":it.def==="Variation"?"#FEF2F2":"#FFFBEB";
    return<tr style={{borderBottom:`1px solid ${B.bdr}`,background:it.incl?bg:"transparent",opacity:it.incl?1:0.5}}>
      <td style={{padding:"6px",textAlign:"center"}}>
        {custom?<span style={{color:B.success,fontWeight:700}}>✓</span>:
        <button onClick={()=>toggleResi(idx)} style={{width:28,height:16,borderRadius:8,border:"none",background:it.incl?B.success:"#CBD5E1",cursor:"pointer",position:"relative"}}><div style={{width:12,height:12,borderRadius:"50%",background:"#fff",position:"absolute",top:2,left:it.incl?14:2,transition:"left .2s"}}/></button>}
      </td>
      <td style={{padding:"6px",color:B.muted,fontSize:10,whiteSpace:"nowrap"}}>{custom?`C${idx+1}`:it.id}</td>
      <td style={{padding:"6px",fontWeight:it.incl?500:400,fontSize:11}}>{it.n}{custom&&<span style={{fontSize:9,color:B.accent,marginLeft:4}}>(custom)</span>}</td>
      <td style={{padding:"6px",textAlign:"right",color:B.muted,fontSize:11}}>${it.fee.toLocaleString()}</td>
      <td style={{padding:"6px",textAlign:"center"}}>
        {it.incl&&!custom&&<input type="number" step="0.1" min="0.1" value={it.factor} onChange={e=>setResiFactor(idx,e.target.value)} style={{width:45,padding:"2px 4px",borderRadius:3,border:`1px solid ${B.bdr}`,fontSize:11,textAlign:"center"}}/>}
        {it.incl&&custom&&<input type="number" step="0.1" min="0.1" value={it.factor} onChange={e=>{const c=[...resiCustom];c[idx].factor=parseFloat(e.target.value)||1;setResiCustom(c);}} style={{width:45,padding:"2px 4px",borderRadius:3,border:`1px solid ${B.bdr}`,fontSize:11,textAlign:"center"}}/>}
      </td>
      <td style={{padding:"6px",textAlign:"center"}}>
        {it.incl&&!custom&&<input type="number" min="1" value={it.qty} onChange={e=>setResiQty(idx,e.target.value)} style={{width:35,padding:"2px 4px",borderRadius:3,border:`1px solid ${B.bdr}`,fontSize:11,textAlign:"center"}}/>}
        {it.incl&&custom&&<input type="number" min="1" value={it.qty} onChange={e=>{const c=[...resiCustom];c[idx].qty=parseInt(e.target.value)||1;setResiCustom(c);}} style={{width:35,padding:"2px 4px",borderRadius:3,border:`1px solid ${B.bdr}`,fontSize:11,textAlign:"center"}}/>}
      </td>
      <td style={{padding:"6px",textAlign:"right",fontWeight:600,color:it.incl?B.navy:B.muted,fontSize:11}}>{it.incl?`$${Math.round(adj).toLocaleString()}`:"—"}</td>
      <td style={{padding:"6px",textAlign:"center",fontSize:10,color:B.muted}}>{it.risk||0}</td>
      <td style={{padding:"6px",textAlign:"center",fontSize:10,color:B.muted}}>{it.complx||1}</td>
      <td style={{padding:"6px",textAlign:"right",color:B.muted,fontSize:11}}>{it.incl?`$${Math.round(bud).toLocaleString()}`:"—"}</td>
      <td style={{padding:"6px",textAlign:"right",fontSize:11,color:mg>=40?B.success:mg>=20?B.warn:B.danger}}>{it.incl?`${mg}%`:""}</td>
    </tr>;
  }

  // Render a resi section (Required, Optional, Variation)
  function ResiSection({title,subtitle,bgCol,bdCol,items,customItems,emptyMsg}){
    const sectionSum=items.filter(i=>i.incl).reduce((s,i)=>s+adjFee(i),0)+(customItems||[]).filter(i=>i.incl).reduce((s,i)=>s+adjFee(i),0);
    return <div style={{marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",borderRadius:"6px 6px 0 0",background:bgCol,border:`1px solid ${bdCol}`,borderBottom:"none"}}>
        <div><h3 style={{fontSize:13,fontWeight:700,color:B.navy,margin:0}}>{title}</h3><span style={{fontSize:11,color:B.muted}}>{subtitle}</span></div>
        <div style={{fontSize:14,fontWeight:700,color:B.navy}}>${Math.round(sectionSum).toLocaleString()}</div>
      </div>
      <div style={{overflowX:"auto",border:`1px solid ${bdCol}`,borderTop:"none",borderRadius:"0 0 6px 6px"}}>
      {items.length===0&&(!customItems||customItems.length===0)?<div style={{padding:12,textAlign:"center",fontSize:11,color:B.muted}}>{emptyMsg||"No items in this category"}</div>:
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
          <thead><tr style={{background:"#F8FAFC"}}><th style={{padding:"6px",textAlign:"center",width:40}}>SOW</th><th style={{padding:"6px",textAlign:"left",width:34}}>#</th><th style={{padding:"6px",textAlign:"left"}}>Service</th><th style={{padding:"6px",textAlign:"right",width:60}}>Base $</th><th style={{padding:"6px",textAlign:"center",width:50}}>Factor</th><th style={{padding:"6px",textAlign:"center",width:40}}>Qty</th><th style={{padding:"6px",textAlign:"right",width:75}}>Proposal $</th><th style={{padding:"6px",textAlign:"center",width:38}}>Risk</th><th style={{padding:"6px",textAlign:"center",width:45}}>Cmplx</th><th style={{padding:"6px",textAlign:"right",width:65}}>Budget $</th><th style={{padding:"6px",textAlign:"right",width:55}}>Margin</th></tr></thead>
          <tbody>
            {items.map(it=><ItemRow key={it.id} it={it} idx={resiItems.findIndex(x=>x.id===it.id)}/>)}
            {(customItems||[]).map((it,ix)=><ItemRow key={"c"+ix} it={it} idx={resiCustom.findIndex(x=>x.id===it.id)} custom/>)}
          </tbody>
        </table>}
      </div>
    </div>;
  }

  // Partition items into three lists
  const reqList=resiItems.filter(i=>i.def==="Required");
  const optList=resiItems.filter(i=>i.def==="Optional"||i.def===""||!i.def);
  const varList=resiItems.filter(i=>i.def==="Variation");

  return(<div>
    <h1 style={{fontSize:22,fontWeight:700,color:B.navy,marginBottom:4}}>New Proposal</h1>
    <p style={{fontSize:13,color:B.muted,marginBottom:20}}>{isResi?"Residential Fee Calculator — based on Cresco Residential Price List (R6)":"Deliverable-Based Pricing (hourly)"}</p>
    <div style={{display:"flex",gap:0,marginBottom:24}}>{stepLabels.map((s,i)=><div key={i} style={{display:"flex",alignItems:"center",flex:1}}><div style={{display:"flex",alignItems:"center",gap:8}}><div style={{width:28,height:28,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color:"#fff",background:step>i+1?B.success:step===i+1?B.accent:"#CBD5E1"}}>{step>i+1?"✓":i+1}</div><span style={{fontSize:12,fontWeight:step===i+1?600:400,color:step===i+1?B.navy:B.muted}}>{s}</span></div>{i<stepLabels.length-1&&<div style={{flex:1,height:2,background:step>i+1?B.success:"#CBD5E1",margin:"0 8px"}}/>}</div>)}</div>
    <Cd>
      {step===1&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
        <div><label style={{fontSize:12,color:B.muted,display:"block",marginBottom:4}}>Project Name</label><input style={iS} value={f.n} onChange={e=>setF({...f,n:e.target.value})}/></div>
        <div><label style={{fontSize:12,color:B.muted,display:"block",marginBottom:4}}>Client</label><input style={iS} value={f.cl} onChange={e=>setF({...f,cl:e.target.value})}/></div>
        <div><label style={{fontSize:12,color:B.muted,display:"block",marginBottom:4}}>Type {isResi&&<span style={{color:B.accent,fontWeight:600}}>— Residential (tier calculated from item selection)</span>}</label><select style={iS} value={f.ty} onChange={e=>setF({...f,ty:e.target.value})}>{PTYPES.map(t=><option key={t.c} value={t.c}>{t.c} — {t.l}</option>)}</select></div>
        <div><label style={{fontSize:12,color:B.muted,display:"block",marginBottom:4}}>Project Owner {!isResi&&<span style={{fontSize:10,color:B.accent}}>(min L{PO_MIN_LEVEL[gTier(f.te,f.vo)]} for {gTier(f.te,f.vo)} tier)</span>}{isResi&&<span style={{fontSize:10,color:B.accent}}>(tier set in step 2; warning will fire if PO is insufficient)</span>}</label><select style={iS} value={f.po} onChange={e=>setF({...f,po:e.target.value})}><option value="">Select...</option>{(isResi?PO_STAFF:getPOsForTier(gTier(f.te,f.vo))).map(s=><option key={s.n} value={s.n}>{s.n} — L{s.level} {s.title}</option>)}</select></div>
        {!isResi&&<div><label style={{fontSize:12,color:B.muted,display:"block",marginBottom:4}}>Technical (1-4)</label><select style={iS} value={f.te} onChange={e=>{const nf={...f,te:+e.target.value};const nt=gTier(nf.te,nf.vo);const minL=PO_MIN_LEVEL[nt];const curPO=PO_STAFF.find(s=>s.n===nf.po);if(curPO&&curPO.level<minL)nf.po="";setF(nf);}}><option value={1}>1 Standard</option><option value={2}>2 Moderate</option><option value={3}>3 Complex</option><option value={4}>4 Critical</option></select></div>}
        {!isResi&&<div><label style={{fontSize:12,color:B.muted,display:"block",marginBottom:4}}>Volume (1-4)</label><select style={iS} value={f.vo} onChange={e=>{const nf={...f,vo:+e.target.value};const nt=gTier(nf.te,nf.vo);const minL=PO_MIN_LEVEL[nt];const curPO=PO_STAFF.find(s=>s.n===nf.po);if(curPO&&curPO.level<minL)nf.po="";setF(nf);}}><option value={1}>1 Short</option><option value={2}>2 Medium</option><option value={3}>3 Long</option><option value={4}>4 Extended</option></select></div>}
      </div>}

      {step===2&&(isResi?<div>
        {/* Live calculated tier and townhouse mode */}
        <div style={{display:"flex",gap:12,marginBottom:14,flexWrap:"wrap"}}>
          <div style={{padding:"10px 14px",borderRadius:8,background:T[fin].bg,border:`1px solid ${T[fin].bd}`,minWidth:180}}>
            <div style={{fontSize:10,color:T[fin].t,fontWeight:600,textTransform:"uppercase"}}>Calculated tier</div>
            <div style={{fontSize:18,fontWeight:700,color:T[fin].t}}>{fin}</div>
            <div style={{fontSize:10,color:B.muted,marginTop:2}}>Risk total {totalRisk} → Complexity {complxRating} · Hours {resiHrs.toFixed(1)} → Extent {extentRating}</div>
            {f.po&&PO_STAFF.find(s=>s.n===f.po)?.level<PO_MIN_LEVEL[fin]&&<div style={{fontSize:10,color:B.danger,marginTop:4,fontWeight:600}}>⚠ {f.po} does not meet L{PO_MIN_LEVEL[fin]} min for {fin} tier. Reassign.</div>}
          </div>

function Approvals({proj,crs,actionCR,toast}){
  const me=CURRENT_USER;
  const[filter,setFilter]=useState("mine");
  const[expandedCR,setExpandedCR]=useState(null);
  const[crForm,setCrForm]=useState({});  // crId -> {classification, notes, fee}
  function setCrField(id,field,val){setCrForm(prev=>({...prev,[id]:{...(prev[id]||{}),[field]:val}}));}
  function approveCR(cr){
    const f=crForm[cr.id]||{};
    if(!f.classification){toast&&toast("Choose Rework or Variation first","warning");return;}
    if(f.classification==="variation"&&(!f.fee||parseFloat(f.fee)<=0)){toast&&toast("Variation fee required (or set 0 for goodwill)","warning");}
    actionCR(cr.id,f.classification,f.notes||"",parseFloat(f.fee)||0,true);
    setExpandedCR(null);
  }
  function rejectCR(cr){
    const f=crForm[cr.id]||{};
    actionCR(cr.id,f.classification||"variation",f.notes||"",0,false);
    setExpandedCR(null);
  }
  // CR pending queue
  const pendingCRs=crs.filter(c=>c.status==="pending_review");
  // Per-deliverable QA tier items
  const items=[];
  proj.forEach(p=>{(p.dels||[]).forEach(d=>{d.qa.forEach((q,tIdx)=>{
    if(!q.required)return;if(q.status!=="in_review"&&q.status!=="rework")return;
    const since=q.since||(d.submitted?d.submitted.when.slice(0,10):"2026-04-12");
    const age=ageInDays(since);
    const assigneeStaff=PO_STAFF.find(s=>s.n===q.assigned);
    const assigneeLevel=assigneeStaff?assigneeStaff.level:(tIdx+1);
    items.push({proj:p,del:d,tier:q,tIdx,age,since,assigned:q.assigned,assigneeLevel});
  });});});
  const mineCount=items.filter(it=>it.assigned===me.n).length;
  const l2Count=items.filter(it=>it.assigneeLevel===2&&it.assigned!==me.n).length;
  const l3Count=items.filter(it=>it.assigneeLevel===3&&it.assigned!==me.n).length;
  const l4PlusCount=items.filter(it=>it.assigneeLevel>=4&&it.assigned!==me.n).length;
  const allCount=items.length;
  const filtered=items.filter(it=>{
    if(filter==="mine")return it.assigned===me.n;
    if(filter==="L2")return it.assigneeLevel===2&&it.assigned!==me.n;
    if(filter==="L3")return it.assigneeLevel===3&&it.assigned!==me.n;
    if(filter==="L4+")return it.assigneeLevel>=4&&it.assigned!==me.n;
    return true;
  }).sort((a,b)=>(b.age||0)-(a.age||0));
  function ageChip(d){if(d===null||d===undefined)return<span style={{fontSize:11,color:B.muted}}>—</span>;const c=d<=2?B.success:d<=5?B.warn:B.danger;const bg=d<=2?"#ECFDF5":d<=5?"#FFFBEB":"#FEF2F2";return<span style={{display:"inline-block",padding:"3px 10px",borderRadius:12,fontSize:11,fontWeight:700,background:bg,color:c,border:`1px solid ${c}40`,whiteSpace:"nowrap"}}>{d} day{d===1?"":"s"}</span>;}
  return<div>
    <h1 style={{fontSize:22,fontWeight:700,color:B.navy,marginBottom:4}}>Approvals</h1>
    <p style={{fontSize:12,color:B.muted,marginBottom:14}}>Viewing as <strong style={{color:B.navy}}>{me.n}</strong> · <span style={{padding:"1px 6px",borderRadius:3,background:`${B.accent}15`,color:B.accent,fontWeight:600,fontSize:10}}>L{me.level}</span> {me.title} · {items.length} open QA approval{items.length===1?"":"s"} · {pendingCRs.length} pending change request{pendingCRs.length===1?"":"s"}</p>

    {/* Change Requests section */}
    {pendingCRs.length>0&&<Cd style={{marginBottom:14,borderLeft:`4px solid ${B.warn}`}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <h3 style={{fontSize:14,fontWeight:700,color:B.navy,margin:0}}>Client Change Requests ({pendingCRs.length})</h3>
        <span style={{fontSize:10,color:B.muted}}>Classify each as Rework or Variation, add notes, optionally create a new deliverable</span>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>{pendingCRs.map(cr=>{const isOpen=expandedCR===cr.id;const f=crForm[cr.id]||{};const age=ageInDays(cr.raisedAt);return<div key={cr.id} style={{border:`1px solid ${B.bdr}`,borderRadius:8,overflow:"hidden",background:isOpen?"#FFFBEB":"#fff"}}>
        <div onClick={()=>setExpandedCR(isOpen?null:cr.id)} style={{padding:"10px 14px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",gap:12}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:2}}>
              <span style={{fontFamily:"monospace",fontSize:11,color:B.muted}}>{cr.id}</span>
              <span style={{fontSize:12,fontWeight:600,color:B.navy}}>{cr.projId} · {cr.delName}</span>
              {ageChip(age)}
            </div>
            <div style={{fontSize:11,color:B.muted}}>{cr.description.length>120?cr.description.slice(0,120)+"…":cr.description}</div>
          </div>
          <span style={{fontSize:11,color:B.accent,fontWeight:600,whiteSpace:"nowrap"}}>{isOpen?"▾ Close":"▸ Action"}</span>
        </div>
        {isOpen&&<div style={{padding:"0 14px 14px",borderTop:`1px solid ${B.bdr}`}}>
          <div style={{padding:10,background:"#fff",borderRadius:6,border:`1px solid ${B.bdr}`,marginBottom:12,marginTop:10}}>
            <div style={{fontSize:10,color:B.muted,fontWeight:600,marginBottom:4,textTransform:"uppercase"}}>Client description (raised {cr.raisedAt})</div>
            <div style={{fontSize:13,color:B.text,lineHeight:1.45}}>{cr.description}</div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
            <div>
              <label style={{fontSize:10,color:B.muted,display:"block",marginBottom:3,fontWeight:600,textTransform:"uppercase"}}>Classification (Cresco decides)</label>
              <select value={f.classification||""} onChange={e=>setCrField(cr.id,"classification",e.target.value)} style={{width:"100%",padding:"7px 10px",borderRadius:6,border:`1px solid ${B.bdr}`,fontSize:12}}>
                <option value="">— Choose —</option>
                <option value="rework">Rework — Cresco at fault ($0 to client)</option>
                <option value="variation">Variation — scope change (chargeable)</option>
              </select>
            </div>
            <div>
              <label style={{fontSize:10,color:B.muted,display:"block",marginBottom:3,fontWeight:600,textTransform:"uppercase"}}>Fee {f.classification==="rework"?<span style={{color:B.success}}>(fixed at $0)</span>:""}</label>
              <input type="number" min="0" value={f.classification==="rework"?0:(f.fee||"")} disabled={f.classification==="rework"} onChange={e=>setCrField(cr.id,"fee",e.target.value)} placeholder={f.classification==="variation"?"e.g. 1500":"—"} style={{width:"100%",padding:"7px 10px",borderRadius:6,border:`1px solid ${B.bdr}`,fontSize:12,background:f.classification==="rework"?"#F8FAFC":"#fff",boxSizing:"border-box"}}/>
            </div>
          </div>
          <div style={{marginBottom:10}}>
            <label style={{fontSize:10,color:B.muted,display:"block",marginBottom:3,fontWeight:600,textTransform:"uppercase"}}>Staff notes (audit record)</label>
            <textarea value={f.notes||""} onChange={e=>setCrField(cr.id,"notes",e.target.value)} placeholder="Add the rationale, conversation history with client, scope impact…" rows={3} style={{width:"100%",padding:"7px 10px",borderRadius:6,border:`1px solid ${B.bdr}`,fontSize:12,resize:"vertical",boxSizing:"border-box"}}/>
          </div>
          {f.classification&&<div style={{padding:10,background:"#F8FAFC",borderRadius:6,fontSize:11,color:B.muted,marginBottom:10}}>{f.classification==="rework"?<>Creating new deliverable: <strong>Rework — {cr.delName} ({cr.id})</strong> · $0 · Status 01 · QA chain inherited from project tier.</>:<>Creating new deliverable: <strong>Variation — {cr.description.slice(0,40)}…</strong> · ${parseFloat(f.fee)||0} · Status 01 · QA chain inherited from project tier.</>}</div>}
          <div style={{display:"flex",justifyContent:"flex-end",gap:8}}>
            <button onClick={()=>rejectCR(cr)} style={{padding:"7px 14px",borderRadius:6,border:`1px solid ${B.danger}`,background:"#fff",color:B.danger,fontSize:12,fontWeight:600}}>Reject CR</button>
            <button onClick={()=>approveCR(cr)} disabled={!f.classification} style={{padding:"7px 14px",borderRadius:6,border:"none",background:f.classification?B.accent:"#CBD5E1",color:"#fff",fontSize:12,fontWeight:600,cursor:f.classification?"pointer":"not-allowed"}}>Approve &amp; create deliverable</button>
          </div>
        </div>}
      </div>;})}</div>
    </Cd>}

    {/* QA tier approvals */}
    <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>{[
      {k:"mine",l:"My Approvals",c:mineCount},
      {k:"L2",l:"L2",c:l2Count},
      {k:"L3",l:"L3",c:l3Count},
      {k:"L4+",l:"L4+",c:l4PlusCount},
      {k:"all",l:"All Approvals",c:allCount}
    ].map(t=><button key={t.k} onClick={()=>setFilter(t.k)} style={{padding:"7px 14px",borderRadius:20,fontSize:12,fontWeight:600,border:`1px solid ${filter===t.k?B.accent:B.bdr}`,background:filter===t.k?`${B.accent}15`:"#fff",color:filter===t.k?B.accent:B.text,cursor:"pointer"}}>{t.l} <span style={{opacity:.6,marginLeft:4}}>({t.c})</span></button>)}</div>
    <Cd>{filtered.length===0?<div style={{padding:32,textAlign:"center",color:B.muted,fontSize:13}}>{filter==="mine"?`No approvals are currently assigned to ${me.n}.`:filter==="L2"?"No L2 approvals pending (other than yours).":filter==="L3"?"No L3 approvals pending.":filter==="L4+"?"No L4+ approvals pending.":"No open approvals in the portfolio."}</div>:
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}><thead><tr style={{background:"#F8FAFC"}}>{["Age","Project","Deliverable","QA Tier","Assigned","Submitted","Status","Action"].map(h=><th key={h} style={{padding:"9px 10px",textAlign:"left",borderBottom:`2px solid ${B.bdr}`,fontSize:11,fontWeight:600,color:B.muted,textTransform:"uppercase",letterSpacing:".3px"}}>{h}</th>)}</tr></thead>
      <tbody>{filtered.map((it,i)=><tr key={i} style={{borderBottom:`1px solid ${B.bdr}`}}>
        <td style={{padding:"8px 10px"}}>{ageChip(it.age)}</td>
        <td style={{padding:"8px 10px"}}><div style={{fontSize:11,fontWeight:600,fontFamily:"monospace"}}>{it.proj.id}</div><div style={{fontSize:11,color:B.muted}}>{it.proj.n.length>30?it.proj.n.slice(0,30)+"…":it.proj.n} · <TB tier={it.proj.tier}/></div></td>
        <td style={{padding:"8px 10px"}}><div style={{fontSize:11,fontFamily:"monospace",color:B.muted}}>{it.del.id}</div><div style={{fontSize:12,fontWeight:500}}>{it.del.n}</div></td>
        <td style={{padding:"8px 10px"}}><span style={{fontSize:10,padding:"2px 8px",borderRadius:4,background:T[it.proj.tier].bg,color:T[it.proj.tier].t,fontWeight:700}}>L{it.tIdx+1}</span><div style={{fontSize:10,color:B.muted,marginTop:2}}>{it.tier.role.split(" ").slice(1).join(" ")||it.tier.role}</div></td>
        <td style={{padding:"8px 10px"}}><div style={{fontSize:12}}>{it.assigned}</div><div style={{fontSize:10,color:it.assigned===me.n?B.accent:B.muted}}>{it.assigned===me.n?"(me)":`L${it.assigneeLevel}`}</div></td>
        <td style={{padding:"8px 10px",fontSize:11,color:B.muted,whiteSpace:"nowrap"}}>{it.since}</td>
        <td style={{padding:"8px 10px"}}>{qaStatusChip(it.tier.status)}</td>
        <td style={{padding:"8px 10px"}}><div style={{display:"flex",gap:4}}>
          <button onClick={()=>toast(`${me.n} approved L${it.tIdx+1} on ${it.del.n}`,"success")} style={{padding:"4px 10px",borderRadius:4,border:"none",background:B.success,color:"#fff",fontSize:10,fontWeight:600}}>Approve</button>
          <button onClick={()=>toast(`Sent ${it.del.n} back for rework`,"warning")} style={{padding:"4px 10px",borderRadius:4,border:`1px solid ${B.danger}`,background:"#fff",color:B.danger,fontSize:10,fontWeight:600}}>Send back</button>
        </div></td>
      </tr>)}</tbody></table>}
    </Cd>
    <div style={{display:"flex",gap:8,marginTop:12,fontSize:11,color:B.muted,alignItems:"center"}}>
      <span style={{display:"inline-block",padding:"2px 8px",borderRadius:10,fontSize:11,fontWeight:700,background:"#ECFDF5",color:B.success,border:`1px solid ${B.success}40`}}>≤ 2 days</span>
      <span style={{display:"inline-block",padding:"2px 8px",borderRadius:10,fontSize:11,fontWeight:700,background:"#FFFBEB",color:B.warn,border:`1px solid ${B.warn}40`}}>3–5 days</span>
      <span style={{display:"inline-block",padding:"2px 8px",borderRadius:10,fontSize:11,fontWeight:700,background:"#FEF2F2",color:B.danger,border:`1px solid ${B.danger}40`}}>&gt; 5 days</span>
      <span style={{marginLeft:8}}>Sorted oldest-first. Switch users by changing the CURRENT_USER constant.</span>
    </div>
  </div>;
}

function KPIAnalytics(){const[secF,setSecF]=useState("All");const[tierF,setTierF]=useState("All");const[alF,setAlF]=useState("All");const[sel,setSel]=useState(null);const[tr,setTr]=useState("1y");
  const allM=KS.flatMap(s=>s.metrics.map(m=>({...m,sec:s.full,secName:s.name})));
  const filt=allM.filter(m=>(secF==="All"||m.sec.startsWith(secF))&&(tierF==="All"||m.t===tierF)&&(alF==="All"||m.al===alF));
  const ranges=[{k:"1w",l:"Week",p:7},{k:"1m",l:"Month",p:30},{k:"3m",l:"Quarter",p:13},{k:"1y",l:"Year",p:52},{k:"2y",l:"2 Years",p:24}];
  if(sel){const rng=ranges.find(r=>r.k===tr)||ranges[3];const seed=sel.n.length;const td=Array.from({length:rng.p},(_,i)=>{const b=50+seed%40;return Math.max(0,Math.round(b+Math.sin(i*.5+seed)*8+(i/(rng.p-1))*10));});const mn=Math.min(...td),mx=Math.max(...td),rr=mx-mn||1;
    return<div><button onClick={()=>setSel(null)} style={{background:"none",border:"none",color:B.accent,fontSize:13,marginBottom:12,padding:0}}>← Back</button>
    <Cd style={{marginBottom:16}}><div style={{display:"flex",justifyContent:"space-between"}}><div><div style={{display:"flex",gap:8,alignItems:"center"}}><h2 style={{fontSize:18,fontWeight:700,color:B.navy,margin:0}}>{sel.n}</h2><span style={{fontSize:10,padding:"2px 6px",borderRadius:3,background:sel.t==="T1"?`${B.accent}15`:"#F8FAFC",color:sel.t==="T1"?B.accent:B.muted,fontWeight:600}}>{sel.t}</span><AB l={sel.al}/></div><div style={{fontSize:12,color:B.muted,marginTop:4}}>{sel.secName}</div></div><div style={{textAlign:"right"}}><div style={{fontSize:12,color:B.muted}}>Target</div><div style={{fontSize:18,fontWeight:700}}>{sel.tg}</div></div></div></Cd>
    <Cd style={{marginBottom:16}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:12}}><div style={{fontSize:14,fontWeight:600,color:B.navy}}>Trend</div><div style={{display:"flex",gap:4}}>{ranges.map(r=><button key={r.k} onClick={()=>setTr(r.k)} style={{padding:"4px 10px",borderRadius:4,border:`1px solid ${tr===r.k?B.accent:B.bdr}`,background:tr===r.k?`${B.accent}15`:"#fff",color:tr===r.k?B.accent:B.muted,fontSize:11}}>{r.l}</button>)}</div></div>
      <svg width="100%" height="140" viewBox="0 0 600 140">{td.map((v,i)=>{const x=(i/(td.length-1))*580+10,y=130-((v-mn)/rr)*110;return<Fragment key={i}>{i>0&&<line x1={((i-1)/(td.length-1))*580+10} y1={130-((td[i-1]-mn)/rr)*110} x2={x} y2={y} stroke={B.accent} strokeWidth="2"/>}<circle cx={x} cy={y} r="3" fill={B.accent}/></Fragment>;})}</svg>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:B.muted}}><span>Oldest</span><span>{rng.p} points</span><span>Latest</span></div></Cd>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
      <Cd><div style={{fontSize:12,fontWeight:600,color:B.muted,marginBottom:6}}>WHAT</div><div style={{fontSize:13,lineHeight:1.6}}>{sel.w}</div></Cd>
      <Cd><div style={{fontSize:12,fontWeight:600,color:B.muted,marginBottom:6}}>DETAILS</div>{[["Applies",sel.a],["Bounds",sel.b],["Source",sel.s]].map(([k,v])=><div key={k} style={{fontSize:13,marginBottom:4}}><strong>{k}:</strong> {v}</div>)}</Cd>
      <Cd style={{background:"#FFFBEB",border:"1px solid #FCD34D"}}><div style={{fontSize:12,fontWeight:600,color:"#92400E",marginBottom:6}}>COUNTER-MEASURE</div><div style={{fontSize:13,color:"#92400E"}}>{sel.c}</div></Cd>
    </div></div>;}
  return<div><h1 style={{fontSize:22,fontWeight:700,color:B.navy,marginBottom:4}}>KPI Analytics</h1><p style={{fontSize:13,color:B.muted,marginBottom:12}}>{TM} metrics ({T1} T1 / {TM-T1} T2). Anti-gaming counter-measures.</p>
    <div style={{display:"flex",gap:4,marginBottom:12,flexWrap:"wrap"}}>
      {["All",...KS.map(s=>s.id)].map(s=>{const nm=s==="All"?"All":KS.find(x=>x.id===s)?.name||s;return<button key={s} onClick={()=>setSecF(s)} style={{padding:"4px 10px",borderRadius:20,border:`1px solid ${secF===s?B.accent:B.bdr}`,background:secF===s?`${B.accent}15`:"#fff",color:secF===s?B.accent:B.muted,fontSize:11}}>{nm}</button>;})}
      <span style={{width:1,background:B.bdr,margin:"0 2px"}}/>
      {["All","T1","T2"].map(t=><button key={t} onClick={()=>setTierF(t)} style={{padding:"4px 10px",borderRadius:20,border:`1px solid ${tierF===t?B.navy:B.bdr}`,background:tierF===t?`${B.navy}10`:"#fff",color:tierF===t?B.navy:B.muted,fontSize:11}}>{t}</button>)}
      <span style={{width:1,background:B.bdr,margin:"0 2px"}}/>
      {["All","RED","AMBER"].map(a=><button key={a} onClick={()=>setAlF(a)} style={{padding:"4px 10px",borderRadius:20,border:`1px solid ${alF===a?B.navy:B.bdr}`,background:alF===a?`${B.navy}10`:"#fff",color:alF===a?B.navy:B.muted,fontSize:11}}>{a}</button>)}
    </div>
    <div style={{fontSize:12,color:B.muted,marginBottom:12}}>{filt.length} of {TM}</div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",gap:8}}>{filt.slice(0,60).map((m,i)=><Cd key={i} onClick={()=>setSel(m)} style={{cursor:"pointer",padding:12}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:B.navy}}>{m.n}</div><div style={{fontSize:10,color:B.muted}}>{m.secName}</div></div><div style={{display:"flex",gap:4}}><span style={{fontSize:10,padding:"1px 5px",borderRadius:3,background:m.t==="T1"?`${B.accent}15`:"#F8FAFC",color:m.t==="T1"?B.accent:B.muted,fontWeight:600}}>{m.t}</span><AB l={m.al}/></div></div><div style={{fontSize:11,color:B.muted}}>Target: {m.tg}</div></Cd>)}</div>
    {filt.length>60&&<div style={{textAlign:"center",padding:16,color:B.muted,fontSize:12}}>Showing 60/{filt.length}. Filter to narrow.</div>}
  </div>;
}

function ProcFlow(){const[llO,setLlO]=useState(false);const[llC,setLlC]=useState({});const[csO,setCsO]=useState(false);const[csR,setCsR]=useState(0);const[csC,setCsC]=useState("");
  const llR=["L1 Peer","L2 Tech Lead","L3 Dept Head","L4 Eng Mgr","Project Owner"];
  const stages=[{n:1,nm:"Enquiry",c:"#3B82F6",it:["Tiny+ intake","10 types","S&M classifies"]},{n:2,nm:"Estimating",c:"#8B5CF6",it:["4×4 matrix","Fee gates","5 pack types"]},{n:3,nm:"Acceptance",c:"#EC4899",it:["SetupIntent","Bank transfer alt","PO confirmation"]},{n:4,nm:"Documents",c:"#F59E0B",it:["4 paths","Locks at 02","Post-lock = variation"]},{n:5,nm:"Production & QA",c:"#059669",it:["Status 02 WIP","QA per tier","Observations logged"]},{n:6,nm:"Rework",c:"#DC2626",it:["06 = Internal","25 = Client (QA escape)","$0 revenue","25 auto-NC"]},{n:7,nm:"Approved",c:"#14B8A6",it:["Status 08","Invoice (09)","Packaged (10)"]},{n:8,nm:"Release",c:"#6366F1",it:["Transmittal","PaymentIntent","Status 11"]},{n:9,nm:"Client Review",c:"#D97706",it:["Amber/Red only","7-day timeout","Dispute classification"]},{n:10,nm:"Closeout",c:"#0EA5E9",it:["Inspections 14-17","Payment at delivery","Lessons learned","Client survey"]}];
  return<div><h1 style={{fontSize:22,fontWeight:700,color:B.navy,marginBottom:4}}>Process Flow</h1><p style={{fontSize:13,color:B.muted,marginBottom:16}}>Process Manual</p>{stages.map((s,i)=><div key={s.n} style={{display:"flex",gap:16,alignItems:"flex-start",marginBottom:4}}><div style={{display:"flex",flexDirection:"column",alignItems:"center",flexShrink:0}}><div style={{width:40,height:40,borderRadius:"50%",background:s.c,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:15}}>{s.n}</div>{i<9&&<div style={{width:2,height:30,background:`${stages[i+1].c}40`,marginTop:4}}/>}</div><Cd style={{flex:1,borderLeft:`4px solid ${s.c}`,marginBottom:8,padding:14}}><div style={{fontSize:14,fontWeight:600,color:B.navy,marginBottom:6}}>{s.nm}</div><div style={{display:"flex",flexWrap:"wrap",gap:4}}>{s.it.map((item,j)=><span key={j} style={{fontSize:11,padding:"3px 8px",borderRadius:4,background:`${s.c}10`,color:s.c,fontWeight:500}}>{item}</span>)}</div></Cd></div>)}
  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginTop:16}}>
    <Cd style={{borderTop:"4px solid #8B5CF6"}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:12}}><h3 style={{fontSize:15,fontWeight:600,color:B.navy,margin:0}}>Lessons Learned</h3><button onClick={()=>setLlO(!llO)} style={{padding:"6px 14px",borderRadius:6,border:"none",background:"#8B5CF6",color:"#fff",fontSize:12}}>{llO?"Close":"Open"}</button></div>
      <div style={{fontSize:12,color:B.muted,marginBottom:8}}>Each QA chain member comments at closeout.</div>
      {llO&&<div>{llR.map((r,i)=><div key={i} style={{marginBottom:8}}><div style={{fontSize:12,fontWeight:600,color:B.navy,marginBottom:4}}>{r}</div><textarea style={{width:"100%",padding:"6px",borderRadius:4,border:`1px solid ${B.bdr}`,fontSize:12,resize:"vertical",height:50,boxSizing:"border-box"}} placeholder="What went well? What to improve?" value={llC[i]||""} onChange={e=>{const c={...llC};c[i]=e.target.value;setLlC(c);}}/></div>)}<button onClick={()=>{setLlO(false);alert("Submitted.");}} style={{padding:"8px 16px",borderRadius:6,border:"none",background:B.success,color:"#fff",fontSize:12}}>Submit</button></div>}
    </Cd>
    <Cd style={{borderTop:"4px solid #F59E0B"}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:12}}><h3 style={{fontSize:15,fontWeight:600,color:B.navy,margin:0}}>Client Survey</h3><button onClick={()=>setCsO(!csO)} style={{padding:"6px 14px",borderRadius:6,border:"none",background:"#F59E0B",color:"#fff",fontSize:12}}>{csO?"Close":"Open"}</button></div>
      <div style={{fontSize:12,color:B.muted,marginBottom:8}}>1–5 star rating. Feeds Client Satisfaction KPI.</div>
      {csO&&<div><div style={{display:"flex",gap:8,marginBottom:8}}>{[1,2,3,4,5].map(s=><button key={s} onClick={()=>setCsR(s)} style={{width:44,height:44,borderRadius:8,border:`2px solid ${csR>=s?"#F59E0B":B.bdr}`,background:csR>=s?"#FFFBEB":"#fff",fontSize:22,display:"flex",alignItems:"center",justifyContent:"center",color:csR>=s?"#F59E0B":"#CBD5E1"}}>{csR>=s?"★":"☆"}</button>)}</div>
      {csR>0&&<div style={{fontSize:12,color:"#92400E",marginBottom:8}}>{["","Poor","Below expectations","Satisfactory","Good","Excellent"][csR]}</div>}

    <Cd>

  </div>;
}

            <td style={{padding:"6px 8px"}}><span style={{fontSize:10,padding:"2px 8px",borderRadius:10,background:`${stColor}15`,color:stColor,fontWeight:600,border:`1px solid ${stColor}30`}}>{c.status==="pending_review"?"Pending Cresco review":c.status==="classified"?"Under review":c.status==="actioned"?(c.classification==="rework"?"Rework agreed":"Variation agreed"):"Rejected"}</span></td>
            <td style={{padding:"6px 8px",fontSize:11,color:B.muted}}>{c.newDel?<span style={{color:B.success}}>New deliverable {c.newDel.id} created{c.classification==="variation"&&c.newDel.fee>0?` ($${c.newDel.fee.toLocaleString()})`:""}</span>:c.staffNotes?c.staffNotes.slice(0,40):"—"}</td>
          </tr>;})}</tbody>
        </table>
      </Cd>}
      {(()=>{const pBk=(bookingRequests||[]).filter(b=>b.proj===pr.id);if(pBk.length===0)return null;return<Cd style={{marginTop:14}}>

          </div>

            <button onClick={()=>setShowBk(false)} style={{padding:"8px 16px",borderRadius:6,border:`1px solid ${B.bdr}`,background:"#fff",fontSize:12}}>Cancel</button>

function stateChip(s){const m={fire:{c:B.danger,l:"Fire"},acknowledged:{c:B.warn,l:"Ack"},intervene:{c:B.blue,l:"Intervene"},resolve:{c:B.success,l:"Resolved"},suppress:{c:B.muted,l:"Suppressed"}}[s]||{c:B.muted,l:s};return<span style={{display:"inline-block",padding:"2px 8px",borderRadius:10,fontSize:10,fontWeight:600,background:`${m.c}15`,color:m.c,border:`1px solid ${m.c}30`}}>{m.l}</span>;}

function inspAddDays(d,n){const dt=new Date(d);dt.setDate(dt.getDate()+n);return dt.toISOString().slice(0,10);}
function inspRand(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function inspGenStageData(type,activeIdx){
  const stages=(STAGES[type]||DEFAULT_STAGES_I);
  return stages.map((s,i)=>{
    const relIdx=i-activeIdx;
    let status,date,progress;
    if(relIdx<0){status="Complete";date=inspAddDays("2026-04-10",i*12);progress=[5,5];}
    else if(relIdx===0){status="Accepted";date=inspAddDays("2026-05-19",i*2);progress=[inspRand(1,4),inspRand(5,8)];}
    else if(relIdx===1){status="Scheduled";date=inspAddDays("2026-05-25",i*3);progress=[0,inspRand(5,8)];}
    else{status="Not Scheduled";date="";progress=[0,inspRand(5,8)];}
    const thirdParties=[];
    if(s.name.includes("Pier")||s.name.includes("Foundation")||s.name.includes("Concrete")||s.name.includes("Compaction")){thirdParties.push({name:"NATA Labs QLD",service:"Concrete/Compaction Testing"});}
    if(s.name.includes("Fire")){thirdParties.push({name:"FireCert Australia",service:"Fire Rating Certification"});}
    const assignedStaff=relIdx<=0?[PO_STAFF[inspRand(0,4)].n]:[];
    return{...s,status,date,progress,thirdParties,assignedStaff};
  });
}

function inspStatusColor(s){
  const m={"Confirmed":"green","Pending":"amber","Postponed":"red","Complete":"green","Accepted":"blue","Scheduled":"cyan","In Progress":"blue","Not Scheduled":"gray","Report Issued":"green","Not Started":"gray","In Review":"amber","Approved":"green","Requires Additional Evidence":"red"};

function BadgeI({label,color,small}){
  const colors={green:{bg:"#ECFDF5",t:B.success,bd:"#A7F3D0"},amber:{bg:"#FFFBEB",t:B.warn,bd:"#FCD34D"},red:{bg:"#FEF2F2",t:B.danger,bd:"#FCA5A5"},blue:{bg:"#EFF6FF",t:B.blue,bd:"#93C5FD"},gray:{bg:B.lightBg,t:B.muted,bd:"#CBD5E1"},navy:{bg:B.navy,t:"#FFF",bd:B.navy},cyan:{bg:"#ECFEFF",t:B.cyan,bd:"#A5F3FC"}};
  const c=colors[color]||colors.gray;
  return <span style={{display:"inline-block",padding:small?"2px 6px":"3px 10px",borderRadius:small?3:4,fontSize:small?10:11,fontWeight:600,background:c.bg,color:c.t,border:`1px solid ${c.bd}`,lineHeight:"1.4",whiteSpace:"nowrap"}}>{label}</span>;
}
function ProgressBarI({done,total,width}){
  const pct=total>0?Math.round(done/total*100):0;
  return <div style={{display:"flex",alignItems:"center",gap:8}}>
    <div style={{width:width||80,height:6,borderRadius:3,background:B.bdr,overflow:"hidden"}}>
      <div style={{width:`${pct}%`,height:"100%",borderRadius:3,background:pct===100?B.success:B.accent,transition:"width .3s"}}/>
    </div>
    <span style={{fontSize:11,color:B.muted,whiteSpace:"nowrap"}}>{done}/{total}</span>
  </div>;
}
function BtnI({children,onClick,variant,small,disabled}){
  const styles={primary:{background:B.accent,color:"#FFF",border:"none"},success:{background:B.success,color:"#FFF",border:"none"},danger:{background:B.danger,color:"#FFF",border:"none"},outline:{background:"transparent",color:B.accent,border:`1px solid ${B.accent}`},ghost:{background:"transparent",color:B.muted,border:`1px solid ${B.bdr}`}};
  const s=styles[variant||"primary"];
  return <button onClick={onClick} disabled={disabled} style={{...s,padding:small?"4px 10px":"7px 16px",borderRadius:6,fontSize:small?11:12,fontWeight:600,opacity:disabled?.5:1,cursor:disabled?"not-allowed":"pointer",transition:"all .15s"}}>{children}</button>;
}
function WorkflowBarI({current}){
  const steps=["Evidence Collection","Internal Review","Report Generation","Client Delivery"];
  const ci=steps.indexOf(current);
  return <div style={{display:"flex",alignItems:"center",gap:0,margin:"16px 0"}}>
    {steps.map((s,i)=>{const done=i<ci;const active=i===ci;return <Fragment key={i}>
      <div style={{display:"flex",alignItems:"center",gap:6}}>
        <div style={{width:24,height:24,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,background:done?B.success:active?B.accent:B.bdr,color:done||active?"#FFF":B.muted}}>{done?"✓":i+1}</div>

      {i<steps.length-1&&<div style={{flex:1,height:2,background:done?B.success:B.bdr,margin:"0 8px",minWidth:20}}/>}

}

function InspB({toast}){
  const[mode,setMode]=useState("Live Execution");
  const[level,setLevel]=useState(1);
  const[selectedProject,setSelectedProject]=useState(null);
  const[selectedStage,setSelectedStage]=useState(null);
  const[filter,setFilter]=useState("All");
  const[search,setSearch]=useState("");
  const[projects,setProjects]=useState(INSP_LIVE);
  const[brTab,setBrTab]=useState("Design-linked checklists");
  const brTabs=["Design-linked checklists","Evidence","Findings","Reports"];
  const modes=["Live Execution","Brief Alignment"];

  const filtered=useMemo(()=>{
    let p=projects;
    if(filter!=="All")p=p.filter(x=>x.status===filter);
    if(search){const q=search.toLowerCase();p=p.filter(x=>x.name.toLowerCase().includes(q)||x.id.toLowerCase().includes(q)||x.client.toLowerCase().includes(q));}
    return p.slice().sort((a,b)=>a.nextInspDate.localeCompare(b.nextInspDate));
  },[projects,filter,search]);

  function goProject(p){setSelectedProject(p);setLevel(2);}
  function goStage(s){setSelectedStage(s);setLevel(3);}
  function goBack(){if(level===3){setSelectedStage(null);setLevel(2);}else if(level===2){setSelectedProject(null);setLevel(1);}}
  function jumpProjects(){setLevel(1);setSelectedProject(null);setSelectedStage(null);}

  return <div>
    <h1 style={{fontSize:22,fontWeight:700,color:B.navy,marginBottom:4}}>Inspections — Part B · Execution & Design-Compliance Verification</h1>
    <p style={{fontSize:12,color:B.muted,marginBottom:10}}>Every inspection is tied to a specific Cresco design package. Findings are the verified interpretation of evidence by a named Cresco engineer. Raw evidence is not a finding.</p>

    {/* Top-level mode switch — Live Execution (drill-down) vs Brief Alignment (governance view) */}
    <div style={{display:"flex",gap:0,marginBottom:14,borderBottom:`2px solid ${B.bdr}`}}>
      {modes.map(m=><button key={m} onClick={()=>setMode(m)} style={{padding:"10px 18px",fontSize:13,fontWeight:mode===m?700:500,color:mode===m?B.accent:B.muted,background:"transparent",border:"none",borderBottom:mode===m?`2px solid ${B.accent}`:"2px solid transparent",marginBottom:-2,cursor:"pointer"}}>{m}</button>)}
    </div>

    {mode==="Live Execution"&&<div>
      {/* Breadcrumb */}
      {level>1&&<div style={{padding:"10px 14px",background:"#fff",border:`1px solid ${B.bdr}`,borderRadius:8,display:"flex",alignItems:"center",gap:6,fontSize:12,color:B.muted,marginBottom:14}}>
        <span style={{cursor:"pointer",color:B.accent,fontWeight:600}} onClick={jumpProjects}>Projects</span>
        {level>=2&&selectedProject&&<><span>/</span><span style={{cursor:level===3?"pointer":"default",color:level===3?B.accent:B.text,fontWeight:level===2?600:400}} onClick={()=>{if(level===3)goBack();}}>{selectedProject.name}</span></>}
        {level===3&&selectedStage&&<><span>/</span><span style={{fontWeight:600,color:B.text}}>{selectedStage.name}</span></>}
      </div>}
      {level===1&&<InspL1 projects={filtered} filter={filter} setFilter={setFilter} search={search} setSearch={setSearch} onSelect={goProject}/>}
      {level===2&&selectedProject&&<InspL2 project={selectedProject} onBack={goBack} onSelectStage={goStage} setProject={p=>{setSelectedProject(p);setProjects(prev=>prev.map(x=>x.id===p.id?p:x));}} toast={toast}/>}
      {level===3&&selectedProject&&selectedStage&&<InspL3 project={selectedProject} stage={selectedStage} onBack={goBack} setStage={s=>{setSelectedStage(s);setSelectedProject(prev=>({...prev,stageData:prev.stageData.map(x=>x.id===s.id?s:x)}));}} toast={toast}/>}
    </div>}

    {mode==="Brief Alignment"&&<div>
      <Tabs tabs={brTabs} active={brTab} onChange={setBrTab}/>
      {brTab==="Design-linked checklists"&&<div>{INSP_DESIGN_PKGS.map(p=><Cd key={p.id} style={{marginBottom:12}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}><div><div style={{fontSize:14,fontWeight:700,color:B.navy}}>{p.id} · {p.proj}</div><div style={{fontSize:11,color:B.muted}}>Rev {p.rev} · {p.author} · Issued {p.issued}</div></div><span style={{fontSize:11,padding:"3px 8px",borderRadius:10,background:`${B.accent}15`,color:B.accent,fontWeight:600}}>{p.clauses.length} verification clauses</span></div><table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}><thead><tr style={{background:"#F8FAFC"}}>{["Clause","Description","Verification requirement"].map(h=><th key={h} style={{padding:"6px 8px",textAlign:"left",borderBottom:`1px solid ${B.bdr}`,fontSize:11,fontWeight:600}}>{h}</th>)}</tr></thead><tbody>{p.clauses.map(c=><tr key={c.cl} style={{borderBottom:`1px solid ${B.bdr}`}}><td style={{padding:"6px 8px",fontFamily:"monospace",fontSize:11,fontWeight:600}}>{c.cl}</td><td style={{padding:"6px 8px"}}>{c.desc}</td><td style={{padding:"6px 8px",color:B.muted,fontSize:11}}>{c.verify}</td></tr>)}</tbody></table></Cd>)}
        <Cd><div style={{fontSize:13,fontWeight:600,color:B.navy,marginBottom:6}}>AI-assisted checklist assembly</div><div style={{fontSize:12,color:B.muted,lineHeight:1.55}}>Checklist items derive from clauses the design engineer has flagged as requiring on-site verification. The Agentic AI Layer (Brief §7) is the intended home for assembling these checklists from the design package; engineer reviews before issue. The <strong>Live Execution</strong> workspace shows how these checklists are operated on site — stage-by-stage, with pass/fail/N-A capture against each clause.</div></Cd></div>}
      {brTab==="Evidence"&&<Cd><table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}><thead><tr style={{background:"#F8FAFC"}}>{["Evidence","Booking","Clause","Type","Captor","Source","Captured","Synced","Metadata"].map(h=><th key={h} style={{padding:"8px 8px",textAlign:"left",borderBottom:`2px solid ${B.bdr}`,fontSize:11,fontWeight:600}}>{h}</th>)}</tr></thead><tbody>{INSP_EVIDENCE.map(e=><tr key={e.id} style={{borderBottom:`1px solid ${B.bdr}`}}><td style={{padding:"6px 8px",fontFamily:"monospace",fontSize:11}}>{e.id}</td><td style={{padding:"6px 8px",fontFamily:"monospace",fontSize:11}}>{e.booking}</td><td style={{padding:"6px 8px",fontFamily:"monospace",fontSize:11,fontWeight:600}}>{e.clause}</td><td style={{padding:"6px 8px"}}>{e.type}</td><td style={{padding:"6px 8px"}}>{e.captor}</td><td style={{padding:"6px 8px"}}><span style={{fontSize:10,padding:"2px 6px",borderRadius:4,background:e.source==="In-house"?`${B.success}15`:`${B.warn}15`,color:e.source==="In-house"?B.success:B.warn,fontWeight:600}}>{e.source}</span></td><td style={{padding:"6px 8px",fontSize:11,color:B.muted}}>{e.captured}</td><td style={{padding:"6px 8px"}}>{e.synced?<span style={{color:B.success,fontWeight:600}}>✓</span>:<span style={{color:B.warn,fontWeight:600}}>offline</span>}</td><td style={{padding:"6px 8px",fontSize:11,color:B.muted}}>{e.meta}</td></tr>)}</tbody></table><div style={{fontSize:11,color:B.muted,marginTop:10,padding:10,borderRadius:6,background:"#F8FAFC"}}>Offline capture supported. Media is tagged with booking ID, design-clause reference, checklist item, timestamp, geolocation and authenticated user. Conflict resolution: device-wins for raw media, server-wins for curated metadata.</div></Cd>}
      {brTab==="Findings"&&<Cd><table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}><thead><tr style={{background:"#F8FAFC"}}>{["Finding","Booking","Clause","Evidence","Outcome","Verified by","Published","Note"].map(h=><th key={h} style={{padding:"8px 8px",textAlign:"left",borderBottom:`2px solid ${B.bdr}`,fontSize:11,fontWeight:600}}>{h}</th>)}</tr></thead><tbody>{INSP_FINDINGS.map(f=>{const oc=f.outcome.toLowerCase();const col=oc.includes("compliant")?B.success:oc.includes("acceptable")?B.warn:oc.includes("awaiting")?B.muted:B.danger;return<tr key={f.id} style={{borderBottom:`1px solid ${B.bdr}`}}><td style={{padding:"6px 8px",fontFamily:"monospace",fontSize:11}}>{f.id}</td><td style={{padding:"6px 8px",fontFamily:"monospace",fontSize:11}}>{f.booking}</td><td style={{padding:"6px 8px",fontFamily:"monospace",fontSize:11,fontWeight:600}}>{f.clause}</td><td style={{padding:"6px 8px",fontSize:11}}>{f.evidence}</td><td style={{padding:"6px 8px"}}><span style={{fontSize:10,padding:"3px 8px",borderRadius:10,background:`${col}15`,color:col,fontWeight:600}}>{f.outcome}</span></td><td style={{padding:"6px 8px",fontSize:11}}>{f.verifiedBy}</td><td style={{padding:"6px 8px"}}>{f.published?<span style={{color:B.success}}>✓</span>:<span style={{color:B.muted}}>draft</span>}</td><td style={{padding:"6px 8px",fontSize:11,color:B.muted}}>{f.note}</td></tr>;})}</tbody></table><div style={{fontSize:11,color:B.muted,marginTop:10,padding:10,borderRadius:6,background:"#F8FAFC"}}>No finding is published without a verification record from a named Cresco engineer. Deviations route into variation or remediation workflows. Reports are versioned with a visible revision log.</div></Cd>}
      {brTab==="Reports"&&<Cd><div style={{fontSize:13,fontWeight:600,color:B.navy,marginBottom:8}}>Published inspection reports</div><table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}><thead><tr style={{background:"#F8FAFC"}}>{["Report","Project","Booking","Findings","Revision","Published","Client portal"].map(h=><th key={h} style={{padding:"8px 8px",textAlign:"left",borderBottom:`2px solid ${B.bdr}`,fontSize:11,fontWeight:600}}>{h}</th>)}</tr></thead><tbody><tr style={{borderBottom:`1px solid ${B.bdr}`}}><td style={{padding:"6px 8px",fontFamily:"monospace",fontSize:11}}>RPT-0412</td><td style={{padding:"6px 8px"}}>CRE-2026-015</td><td style={{padding:"6px 8px",fontFamily:"monospace",fontSize:11}}>BOK-0129</td><td style={{padding:"6px 8px"}}>2 published · 1 pending</td><td style={{padding:"6px 8px"}}>R01</td><td style={{padding:"6px 8px",fontSize:11,color:B.muted}}>2026-04-18</td><td style={{padding:"6px 8px"}}><span style={{color:B.success}}>✓ visible</span></td></tr><tr style={{borderBottom:`1px solid ${B.bdr}`}}><td style={{padding:"6px 8px",fontFamily:"monospace",fontSize:11}}>RPT-0413</td><td style={{padding:"6px 8px"}}>CRE-2026-016</td><td style={{padding:"6px 8px",fontFamily:"monospace",fontSize:11}}>BOK-0131</td><td style={{padding:"6px 8px"}}>1 published · lab result pending</td><td style={{padding:"6px 8px"}}>R01 (draft)</td><td style={{padding:"6px 8px",fontSize:11,color:B.muted}}>—</td><td style={{padding:"6px 8px",color:B.muted}}>pending</td></tr></tbody></table><div style={{fontSize:11,color:B.muted,marginTop:10,padding:10,borderRadius:6,background:"#F8FAFC"}}>Two artefacts per inspection: internal compliance record (quality file + variation/remediation workflows) and client-facing inspection report (Client Delivery Portal). Every report is a Cresco report. Staff auth via M365 SSO; no separate cryptographic infrastructure.</div></Cd>}
      <Cd style={{marginTop:12}}><div style={{fontSize:13,fontWeight:600,color:B.navy,marginBottom:6}}>Out of scope (explicit)</div><div style={{fontSize:12,color:B.muted,lineHeight:1.55}}>Internal Cresco QA capability only. Not a SaaS product. Not an external evidentiary platform. Onward commercialisation to insurers, warranty schemes or other consultancies is explicitly out of scope. Periodic inspection programmes, asset register management, automated renewals and jurisdiction-specific statutory lodgement are candidates for subsequent extension phases.</div></Cd>
    </div>}
  </div>;
}

function Programme(){return<div><h1 style={{fontSize:22,fontWeight:700,color:B.navy,marginBottom:4}}>Programme — Phases & Commercial Envelope</h1><p style={{fontSize:12,color:B.muted,marginBottom:16}}>Portal Developer Brief v1.3 · 24 weeks P1–P5 + 4-week hardening · AI workstream in parallel.</p>
  <Cd style={{marginBottom:12}}><div style={{fontSize:13,fontWeight:600,color:B.navy,marginBottom:8}}>Commercial envelope</div><div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}><SC label="Build (P1–P5)" value={COMMERCIAL.build}/><SC label="Runtime" value={COMMERCIAL.runtime} sub="AI + infra"/><SC label="Tolerance" value={COMMERCIAL.tolerance} al="AMBER"/></div><div style={{fontSize:11,color:B.muted,marginTop:10}}>{COMMERCIAL.notes}</div></Cd>
